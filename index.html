<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field Schedule</title>
<meta name="theme-color" content="#1D5C88">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Schedule">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column, summary first, then a week agenda (or month grid); status lives in a left stripe + pill on every job */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --sunk:#E8EDF1; --ink:#15202B; --muted:#5A6876; --line:#D6DDE3;
  --accent:#1D5C88; --accent-ink:#FFFFFF;
  --red:#C0362C; --amber:#A87900; --amber-mark:#E2AE1C; --green:#2C7A45;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E141A; --surface:#17202A; --sunk:#121A22; --ink:#E5EBF0; --muted:#93A0AD; --line:#283440;
  --accent:#6CB0DE; --accent-ink:#0E141A;
  --red:#EE6D61; --amber:#E7B84A; --amber-mark:#E7B84A; --green:#62C083; color-scheme:dark}}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1;margin:2px 0 0;letter-spacing:.01em}
.who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.who .mode{border:1px solid var(--line);border-radius:99px;padding:0 8px;font-weight:600;font-size:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--c)}
.stat b{font-family:var(--font-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.25}
@media (max-width:560px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* nav */
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav .range{font-family:var(--font-display);font-weight:600;font-size:21px;flex:1;min-width:0}
.icon{width:38px;height:38px;padding:0;font-size:18px}
@media (max-width:560px){.nav .range{flex-basis:100%;order:-1;font-size:20px}.nav .seg{margin-left:auto}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}

/* week agenda */
.days{display:flex;flex-direction:column;gap:14px}
.day h2{margin:0 0 6px;font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day.today h2{color:var(--accent)}
.day.today h2 .tag{font-size:11px;letter-spacing:.1em;border:1px solid currentColor;border-radius:99px;padding:0 7px}
.day .none{color:var(--muted);font-size:13.5px;padding:2px 0 0 2px}
.jobs{display:flex;flex-direction:column;gap:8px}
.job{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:0 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:0 12px 0 0;text-align:left;width:100%;overflow:hidden;min-height:64px}
.job .stripe{align-self:stretch;background:var(--c)}
.job .main{padding:10px 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.job .no{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.job .name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.job .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.job .flag{font-size:12.5px;font-weight:600;color:var(--red)}
.job .notes{font-size:13px;color:var(--muted);font-style:italic;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;color:var(--ct);background:color-mix(in srgb,var(--c) 15%,transparent)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.s-scheduled{--c:var(--red);--ct:var(--red)}
.s-partial{--c:var(--amber-mark);--ct:var(--amber)}
.s-processed{--c:var(--green);--ct:var(--green)}
.s-all{--c:var(--accent)}
@media (max-width:420px){.job .pill .lbl{display:none}.job .pill{padding:6px}}
.offchip{border:1px dashed var(--line);background:var(--sunk);color:var(--muted);border-radius:99px;font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;padding:1px 9px}
.offchip:hover{color:var(--ink)}

/* month grid */
.month-wrap{overflow-x:auto}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:340px}
.month .dow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:76px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{background:transparent;border-style:dashed}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .d{border:0;background:none;padding:0 2px;text-align:left;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--muted)}
.chip{border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:3px;font-size:11.5px;line-height:1.25;padding:3px 4px;text-align:left;width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.chip b{font-weight:700}
.cell .offchip{font-size:10.5px;padding:1px 5px;text-align:left;border-radius:4px;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (max-width:560px){.month{gap:2px}.cell{padding:2px;min-height:64px}.chip{font-size:10.5px;padding:2px 3px;border-left-width:3px;-webkit-line-clamp:4}}

/* panels: lock screen, setup, empty */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-family:var(--font-display);font-size:24px}
.panel p{margin:0;color:var(--muted);max-width:62ch}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel .row input{flex:1;min-width:180px}
.panel ol{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.notice{font-size:13.5px;color:var(--muted);margin:0}
.notice.warn{color:var(--red)}
.syncline{font-size:12.5px;color:var(--muted);text-align:right;margin:0}
.ok{color:var(--green);font-size:13.5px;margin:0}

/* fab */
.fabs{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.fab{border-radius:99px;padding:13px 18px;box-shadow:0 6px 18px rgb(0 0 0 / .22);font-size:16px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-family:var(--font-display);font-size:24px;overflow-wrap:anywhere}
.statusset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.statusset button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;line-height:1.2}
.statusset button::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--c)}
.statusset button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.kindset{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kindset button{border:0;background:var(--surface);padding:9px;font-weight:600;color:var(--muted)}
.kindset button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.typeset{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.typeset button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:600;font-size:14px;line-height:1.2}
.typeset button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.typeset button[aria-pressed="true"]{border-color:var(--accent);background:var(--sunk)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,textarea,select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;font-weight:400;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14.5px}
dl.facts dt{color:var(--muted);font-weight:600;font-size:12.5px;padding-top:2px}
dl.facts dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet .actions .right{display:flex;gap:8px}
.danger{color:var(--red)}
.confirm{background:color-mix(in srgb,var(--red) 10%,var(--surface));border:1px solid var(--red);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.stamp{font-size:12.5px;color:var(--muted);margin:0}
.err{color:var(--red);font-size:13.5px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small>Welch Comer · Survey</small><h1>Field Schedule</h1>
      <div class="who" id="who" hidden><span class="mode" id="modeTag"></span><span id="whoName"></span><button class="linkbtn" id="lockBtn">Lock</button></div>
    </div>
    <div class="legend" aria-label="Status key">
      <span class="s-scheduled"><i></i>Not processed</span>
      <span class="s-partial"><i></i>Partially processed</span>
      <span class="s-processed"><i></i>Processed</span>
    </div>
  </header>

  <section id="gate" class="panel" hidden></section>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:16px">
    <section class="summary" id="summary" aria-label="Processing summary"></section>
    <div class="nav">
      <button class="btn icon" id="prev" aria-label="Previous">‹</button>
      <button class="btn" id="todayBtn">Today</button>
      <button class="btn icon" id="next" aria-label="Next">›</button>
      <div class="range" id="range"></div>
      <div class="seg" role="group" aria-label="View">
        <button id="vWeek" aria-pressed="true">Week</button>
        <button id="vMonth" aria-pressed="false">Month</button>
      </div>
    </div>
    <p class="notice warn" id="notice" hidden></p>
    <main id="view" aria-live="polite"></main>
    <p class="syncline" id="syncLine"></p>
  </div>
</div>

<div class="fabs" id="addBtns" hidden>
  <button class="btn fab" id="addOff">+ Time off</button>
  <button class="btn primary fab" id="addBtn">+ Job</button>
</div>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";
  // ===================== settings =====================
  const KEYS_FILE = "keys.json";          // made by the setup screen (#setup); holds the GitHub key, locked with the team passcode
  const ITERATIONS = 250000;              // passcode stretching (PBKDF2-SHA256)
  const DEFAULT_REPO = {owner: "welchcomer", name: "field-schedule-data", path: "schedule.json", branch: "main"};
  const API = "https://api.github.com";
  // ====================================================

  const STATUS = {
    scheduled: {label: "Not processed", cls: "s-scheduled"},
    partial:   {label: "Partially processed", cls: "s-partial"},
    processed: {label: "Processed", cls: "s-processed"},
  };
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
    return n;
  };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("fs." + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("fs." + k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem("fs." + k); } catch {} },
  };

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const weekStart = d => { const x = addDays(d, -d.getDay()); x.setHours(0,0,0,0); return x; };   // weeks start on Sunday
  const todayStr = () => ymd(new Date());
  const fmtDay = d => d.toLocaleDateString(undefined, {weekday: "long", month: "short", day: "numeric"});
  const fmtShort = d => d.toLocaleDateString(undefined, {month: "short", day: "numeric"});

  // ---------- passcode locking (Web Crypto: PBKDF2 → AES-GCM) ----------
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = bytes => { let s = ""; const b = new Uint8Array(bytes); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0));
  const normPass = p => p.normalize("NFKC").trim().toLowerCase();
  async function keyFrom(pass, salt, iterations) {
    const base = await crypto.subtle.importKey("raw", te.encode(normPass(pass)), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
  }
  async function seal(obj, pass) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, await keyFrom(pass, salt, ITERATIONS), te.encode(JSON.stringify(obj)));
    return {salt: b64(salt), iv: b64(iv), ct: b64(ct)};
  }
  async function unseal(entry, pass, iterations) {
    try {
      const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(entry.iv)}, await keyFrom(pass, unb64(entry.salt), iterations), unb64(entry.ct));
      return JSON.parse(td.decode(pt));
    } catch { return null; }
  }

  // ---------- state ----------
  let session = store.get("session");   // {mode: "edit"|"view", token, repo}
  let myName = store.get("name") || "";
  let docData = {v: 1, jobs: []}, sha = null, etag = null;
  let jobs = [], offs = [], loaded = false;
  let view = store.get("view") === "month" ? "month" : "week", anchor = new Date();
  const canEdit = () => session && session.mode === "edit";

  const endOf = j => j.endDate && j.endDate >= j.date ? j.endDate : j.date;
  const covers = (j, day) => j.date <= day && endOf(j) >= day;
  const awaiting = j => (j.status || "scheduled") === "scheduled" && endOf(j) < todayStr();
  const dayNum = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
  // time off can repeat every N weeks (same weekday as its first day), until an optional date, minus skipped days
  const occurs = (o, day) => {
    if (o.skip && o.skip.includes(day)) return false;
    if (!o.repeat) return covers(o, day);
    if (day < o.date || (o.repeat.until && day > o.repeat.until)) return false;
    const span = dayNum(endOf(o)) - dayNum(o.date) + 1, period = 7 * (o.repeat.every || 1);
    return (dayNum(day) - dayNum(o.date)) % period < span;
  };
  const weekdayName = s => parse(s).toLocaleDateString(undefined, {weekday: "long"});
  const repeatText = o => {
    if (!o.repeat) return "";
    const n = o.repeat.every || 1;
    const base = n === 1 ? `Every ${weekdayName(o.date)}` : n === 2 ? `Every other ${weekdayName(o.date)}` : `Every ${n} weeks on ${weekdayName(o.date)}`;
    return base + (o.repeat.until ? ` until ${fmtShort(parse(o.repeat.until))}` : "") + `, starting ${fmtShort(parse(o.date))}`;
  };
  const offLabel = o => `${o.crew || "Someone"} ${(o.offType || "Off").toLowerCase()}`;
  const byOrder = (a, b) => (a.date + (a.crew || "") + (a.jobNo || "") + (a.title || "")).localeCompare(b.date + (b.crew || "") + (b.jobNo || "") + (b.title || ""));

  // ---------- GitHub storage ----------
  const contentsPath = () => `/repos/${encodeURIComponent(session.repo.owner)}/${encodeURIComponent(session.repo.name)}/contents/${session.repo.path.split("/").map(encodeURIComponent).join("/")}`;
  async function gh(path, opts = {}) {
    return fetch(API + path, {method: opts.method || "GET", cache: "no-store",
      headers: {Authorization: "Bearer " + session.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {})},
      body: opts.body ? JSON.stringify(opts.body) : undefined});
  }
  async function httpError(res) {
    let msg = res.statusText || "Request failed"; try { msg = (await res.json()).message || msg; } catch {}
    const e = new Error(msg); e.status = res.status; return e;
  }
  const toB64Utf8 = s => b64(te.encode(s));
  const fromB64Utf8 = s => td.decode(unb64(s));
  function useDoc(d) {
    docData = d && Array.isArray(d.jobs) ? d : {v: 1, jobs: []};
    const valid = docData.jobs.filter(j => j && /^\d{4}-\d{2}-\d{2}$/.test(j.date || ""));
    offs = valid.filter(j => j.kind === "off");
    jobs = valid.filter(j => j.kind !== "off");
  }
  async function fetchDoc(fresh) {
    const res = await gh(`${contentsPath()}?ref=${encodeURIComponent(session.repo.branch)}`, {headers: !fresh && etag ? {"If-None-Match": etag} : {}});
    if (res.status === 304) return false;
    if (res.status === 404) { sha = null; etag = null; useDoc(null); return true; }

  $("lockBtn").onclick = () => lock();

  function askName(then) {
    const inp = el("input", {id: "myname", placeholder: "e.g. Ann", value: myName, autocomplete: "given-name"});
    const form = el("form", {style: "display:contents"},
      el("h3", {text: "What's your name?"}),
      el("p", {text: "It's shown next to the changes you make, so others know who updated a job."}),
      el("div", {class: "row"}, inp, el("button", {class: "btn primary", type: "submit", text: "Continue"})));
    form.addEventListener("submit", e => { e.preventDefault(); if (!inp.value.trim()) return; myName = inp.value.trim(); store.set("name", myName); then(); });
    gate(form); inp.focus();
  }

  function enterApp() {
    if (canEdit() && !myName) return askName(enterApp);
    $("gate").hidden = true; $("app").hidden = false; $("who").hidden = false;
    $("modeTag").hidden = canEdit(); $("modeTag").textContent = "View only";
    $("whoName").textContent = canEdit() ? myName : "";
    render(); load(true);
  }

  // ---------- setup (#setup) — Tom only: locks the GitHub key with the team passcode ----------
  function setupScreen() {
    const f = (id, label, props = {}) => { const i = el("input", {id, ...props}); return [i, el("label", {class: "f full", for: id}, label, i)]; };
    const [iRepo, lRepo] = f("s_repo", "Data repository (owner/name)", {value: `${DEFAULT_REPO.owner}/${DEFAULT_REPO.name}`});
    const [iTok, lTok] = f("s_token", "GitHub key (fine-grained token, Contents: Read and write)", {type: "password", placeholder: "github_pat_…", autocomplete: "off"});
    const [iPass, lPass] = f("s_pass", "Team passcode", {autocomplete: "off"});
    const msg = el("div", {style: "display:flex;flex-direction:column;gap:4px"});
    const say = (t, cls = "notice") => msg.append(el("p", {class: cls, text: t}));
    const btn = el("button", {class: "btn primary", type: "submit", text: "Check key and create keys.json"});
    const form = el("form", {style: "display:contents"},
      el("h3", {text: "Field Schedule setup"}),
      el("p", {text: "Nothing typed here leaves this computer except a check with GitHub. The key is locked with the passcode, and the result downloads as keys.json for you to upload next to index.html."}),
      el("div", {class: "fields"}, lRepo, lTok, lPass), msg,
      el("div", {class: "row"}, btn, el("a", {class: "btn", href: "./", text: "Back to schedule"})));
    form.addEventListener("submit", async e => {
      e.preventDefault(); msg.replaceChildren();
      const [owner, name] = iRepo.value.trim().split("/");
      if (!owner || !name) return say("Enter the data repository as owner/name.", "err");
      if (normPass(iPass.value).length < 8) return say("Use a passcode of at least 8 characters (two or three words is best).", "err");
      btn.disabled = true;
      try {
        const r = await fetch(`${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`, {cache: "no-store", headers: {Authorization: "Bearer " + iTok.value.trim(), Accept: "application/vnd.github+json"}});
        if (!r.ok) throw new Error(r.status === 401 ? "GitHub rejected the key" : r.status === 404 ? `the key can't see ${owner}/${name}` : "GitHub said " + r.status);
        if (!((await r.json()).permissions || {}).push) return say("The key can read but not save. Give it Contents: Read and write.", "err");
        say("The key works.", "ok");
        const repo = {owner, name, path: DEFAULT_REPO.path, branch: DEFAULT_REPO.branch};
        const entries = [await seal({mode: "edit", token: iTok.value.trim(), repo}, iPass.value)];
        const blob = new Blob([JSON.stringify({v: 1, iterations: ITERATIONS, entries}, null, 1)], {type: "application/json"});
        const a = el("a", {href: URL.createObjectURL(blob), download: "keys.json"}); document.body.append(a); a.click(); a.remove();
        say("keys.json downloaded. Upload it to the field-schedule repository (replace the old one if there is one).", "ok");
        iTok.value = "";
      } catch (ex) { say("Couldn't create keys.json: " + ex.message, "err"); }
      finally { btn.disabled = false; }
    });
    gate(form);
  }

  // ---------- boot ----------
  setInterval(() => { if (session && !document.hidden && !$("sheetHost").firstChild) load(false); }, 60000);
  document.addEventListener("visibilitychange", () => { if (session && !document.hidden) load(false); });
  window.addEventListener("hashchange", () => location.reload());
  if (location.hash === "#setup") setupScreen();
  else if (!window.crypto?.subtle) gate(el("h3", {text: "This browser can't open the schedule"}), el("p", {text: "Open the page from its https:// address in an up-to-date browser."}));
  else if (session && session.token) enterApp();
  else lock();
})();
</script>
</body>
</html>
