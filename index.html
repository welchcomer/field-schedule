<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="msal-browser.min.js"></script>
<script>
/* ===================== CONFIGURATION ===================== */
window.FIELD_SCHEDULE_CONFIG = {
  clientId: "500b98fb-d49d-4a26-ac47-ed6fe1eaa3df",
  tenantId: "a7c116b0-6582-487e-91ab-bf679445ed43",
  // From IT after they grant the app read access to the list (see SETUP.md)
  siteId: "",
  listId: ""
};
</script>
<style>
/* Layout: one column, summary first, then a week agenda (or month grid); status lives in a left stripe + pill on every job */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --sunk:#E8EDF1; --ink:#15202B; --muted:#5A6876; --line:#D6DDE3;
  --accent:#1D5C88; --accent-ink:#FFFFFF;
  --red:#C0362C; --amber:#A87900; --amber-mark:#E2AE1C; --green:#2C7A45;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#17202A; --sunk:#121A22; --ink:#E5EBF0; --muted:#93A0AD; --line:#283440;
  --accent:#6CB0DE; --accent-ink:#0E141A;
  --red:#EE6D61; --amber:#E7B84A; --amber-mark:#E7B84A; --green:#62C083; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17202A; --sunk:#121A22; --ink:#E5EBF0; --muted:#93A0AD; --line:#283440;
  --accent:#6CB0DE; --accent-ink:#0E141A;
  --red:#EE6D61; --amber:#E7B84A; --amber-mark:#E7B84A; --green:#62C083; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:14px 96px;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1;margin:2px 0 0;letter-spacing:.01em;text-wrap:balance}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--c)}
.stat b{font-family:var(--font-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.25}
@media (max-width:560px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* nav */
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav .range{font-family:var(--font-display);font-weight:600;font-size:21px;flex:1;min-width:0}
.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:18px}
@media (max-width:560px){.nav .range{flex-basis:100%;order:-1;font-size:20px}.nav .seg{margin-left:auto}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}

/* week agenda */
.days{display:flex;flex-direction:column;gap:14px}
.day h2{margin:0 0 6px;font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day.today h2{color:var(--accent)}
.day.today h2::after{content:"Today";font-size:11px;letter-spacing:.1em;border:1px solid currentColor;border-radius:99px;padding:0 7px}
.day .none{color:var(--muted);font-size:13.5px;padding:2px 0 0 2px}
.jobs{display:flex;flex-direction:column;gap:8px}
.job{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:0 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:0 12px 0 0;text-align:left;width:100%;overflow:hidden;min-height:64px}
.job .stripe{align-self:stretch;background:var(--c)}
.job .main{padding:10px 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.job .no{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.job .name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.job .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.job .flag{font-size:12.5px;font-weight:600;color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;color:var(--ct);background:color-mix(in srgb,var(--c) 15%,transparent)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.s-scheduled{--c:var(--red);--ct:var(--red)}
.s-partial{--c:var(--amber-mark);--ct:var(--amber)}
.s-processed{--c:var(--green);--ct:var(--green)}
.s-all{--c:var(--accent)}
@media (max-width:420px){.job .pill .lbl{display:none}.job .pill{padding:6px}}

/* month grid */
.month-wrap{overflow-x:auto}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:340px}
.month .dow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:76px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{background:transparent;border-style:dashed}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .d{border:0;background:none;padding:0 2px;text-align:left;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--muted)}
.chip{border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:3px;font-size:11.5px;line-height:1.25;padding:3px 4px;text-align:left;width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.chip b{font-weight:700}
@media (max-width:560px){.month{gap:2px}.cell{padding:2px;min-height:64px}.chip{font-size:10.5px;padding:2px 3px;border-left-width:3px;-webkit-line-clamp:4}}
.more{font-size:11px;color:var(--muted);padding-left:2px}
.offchip{border:1px dashed var(--line);background:var(--sunk);color:var(--muted);border-radius:99px;font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;padding:1px 9px}
.offchip:hover{color:var(--ink)}
.cell .offchip{font-size:10.5px;padding:1px 5px;text-align:left;border-radius:4px;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kindset{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kindset button{border:0;background:var(--surface);padding:9px;font-weight:600;color:var(--muted)}
.kindset button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.typeset{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.typeset button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:600;font-size:14px;line-height:1.2}
.typeset button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.typeset button[aria-pressed="true"]{border-color:var(--accent);background:var(--sunk)}

/* empty / notices */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:22px 18px;display:flex;flex-direction:column;gap:10px}
.empty h3{margin:0;font-family:var(--font-display);font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.empty .row{display:flex;gap:8px;flex-wrap:wrap}
.notice{font-size:13.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}

/* sign-in / setup panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-family:var(--font-display);font-size:24px}
.panel p{margin:0;color:var(--muted);max-width:62ch}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel input{flex:1;min-width:200px}
.sitelist{display:flex;flex-direction:column;gap:6px}
.sitelist button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.sitelist small{color:var(--muted);overflow-wrap:anywhere}
.code{font-family:var(--font-mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere;color:var(--ink)}
.who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;margin-top:6px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px}
.syncline{font-size:12.5px;color:var(--muted);text-align:right}

dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14.5px}
dl.facts dt{color:var(--muted);font-weight:600;font-size:12.5px;padding-top:2px}
dl.facts dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center}
a.btn.primary{color:var(--accent-ink)}

/* fab */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:13px 20px;box-shadow:0 6px 18px rgb(0 0 0 / .22);font-size:16px;z-index:5}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-family:var(--font-display);font-size:24px}
.statusset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.statusset button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;line-height:1.2}
.statusset button::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--c)}
.statusset button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;font-weight:400;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet .actions .right{display:flex;gap:8px}
.danger{color:var(--red)}
.confirm{background:color-mix(in srgb,var(--red) 10%,var(--surface));border:1px solid var(--red);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.stamp{font-size:12.5px;color:var(--muted)}
.err{color:var(--red);font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small>Welch Comer · Survey</small><h1>Field Schedule</h1><div class="who" id="who" hidden><span id="whoName"></span><button class="linkbtn" id="signOut">Sign out</button></div></div>
    <div class="legend" aria-label="Status key">
      <span class="s-scheduled"><i></i>Not processed</span>
      <span class="s-partial"><i></i>Partially processed</span>
      <span class="s-processed"><i></i>Processed</span>
    </div>
  </header>

  <section id="gate" class="panel" hidden></section>
  <div id="app" hidden style="display:flex;flex-direction:column;gap:16px">
  <section class="summary" id="summary" aria-label="Processing summary"></section>

  <div class="nav">
    <button class="btn icon" id="prev" aria-label="Previous">‹</button>
    <button class="btn" id="todayBtn">Today</button>
    <button class="btn icon" id="next" aria-label="Next">›</button>
    <div class="range" id="range"></div>
    <div class="seg" role="group" aria-label="View">
      <button id="vWeek" aria-pressed="true">Week</button>
      <button id="vMonth" aria-pressed="false">Month</button>
    </div>
  </div>

  <p class="notice" id="notice" hidden></p>
  <main id="view" aria-live="polite"></main>
  <p class="syncline" id="syncLine"></p>
  </div>

</div>

<a class="btn primary fab" id="addBtn" hidden target="_blank" rel="noopener">+ Add in SharePoint</a>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const STATUS = {
    scheduled: {label:"Not processed", cls:"s-scheduled", cat:"Red Category"},
    partial:   {label:"Partially processed", cls:"s-partial", cat:"Yellow Category"},
    processed: {label:"Processed", cls:"s-processed", cat:"Green Category"},
  };
  const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null) n.append(k);
    return n;
  };

  // ---- dates (local, YYYY-MM-DD strings) ----
  const pad = n => String(n).padStart(2,"0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
  const todayStr = () => ymd(new Date());
  const fmtDay = d => d.toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});
  const fmtShort = d => d.toLocaleDateString(undefined,{month:"short", day:"numeric"});

  // ---- state ----
  const CFG = window.FIELD_SCHEDULE_CONFIG;
  const GRAPH = "https://graph.microsoft.com/v1.0";
  const SCOPES = ["User.Read", "Lists.SelectedOperations.Selected"];
  const LABEL_TO_KEY = {"Not processed": "scheduled", "Partially processed": "partial", "Processed": "processed"};
  let msalApp = null, account = null, siteId = CFG.siteId, listId = CFG.listId, listUrl = "";
  let jobs = [];           // [{id, ...data}]
  let loaded = false;
  let view = "week", anchor = new Date(), filter = "all";
  try { const v = localStorage.getItem("fs.view"); if (v === "week" || v === "month") view = v; } catch {}

  let offs = [];           // time-off entries [{id, crew, type:"Off"|"Out", date, endDate, notes}]
  const offLabel = o => `${o.crew || "Someone"} ${(o.type || "Off").toLowerCase()}`;
  const endOf = j => j.endDate && j.endDate >= j.date ? j.endDate : j.date;
  const covers = (j, day) => j.date <= day && endOf(j) >= day;
  const awaiting = j => (j.status || "scheduled") === "scheduled" && endOf(j) < todayStr();

  // ---- summary ----
  function renderSummary() {
    const t = todayStr();
    const counts = {
      awaiting: jobs.filter(awaiting).length,
      partial: jobs.filter(j => j.status === "partial").length,
      upcoming: jobs.filter(j => (j.status||"scheduled") === "scheduled" && endOf(j) >= t).length,
      processed: jobs.filter(j => j.status === "processed" && endOf(j) >= ymd(addDays(new Date(), -30))).length,
    };
    const tiles = [
      ["awaiting","s-scheduled","Field done, not processed"],
      ["partial","s-partial","Partially processed"],
      ["upcoming","s-all","Scheduled ahead"],
      ["processed","s-processed","Processed, last 30 days"],
    ];
    $("summary").replaceChildren(...tiles.map(([k, cls, label]) =>
      el("div", {class:`stat ${cls}`},
        el("b", {text: loaded ? counts[k] : "–"}), el("span", {text: label}))));
  }
  const passes = j => {
    return true; // the calendar always shows every job; the tiles above only count
    if (filter === "all") return true;
    if (filter === "awaiting") return awaiting(j);
    if (filter === "partial") return j.status === "partial";
    if (filter === "upcoming") return (j.status||"scheduled") === "scheduled" && endOf(j) >= todayStr();
    if (filter === "processed") return j.status === "processed";
    return true;
  };

  // ---- job card ----
  function jobCard(j, day) {
    const st = STATUS[j.status] || STATUS.scheduled;
    const multi = j.endDate && j.endDate > j.date;
    const meta = [j.crew, j.location].filter(Boolean).join(" · ");
    return el("button", {class:`job ${st.cls}`, onclick: () => showDetails(j)},
      el("span", {class:"stripe", "aria-hidden":"true"}),
      el("span", {class:"main"},
        j.jobNo ? el("span", {class:"no", text: j.jobNo}) : null,
        el("span", {class:"name", text: j.title || "Untitled job"}),
        meta ? el("span", {class:"meta", text: meta}) : null,
        multi ? el("span", {class:"meta", text: `${fmtShort(parse(j.date))} – ${fmtShort(parse(j.endDate))}`}) : null,
        awaiting(j) ? el("span", {class:"flag", text:"Field work done · waiting on office"}) : null),
      el("span", {class:"pill"}, el("span", {class:"lbl", text: st.label})));
  }

  // ---- views ----
  function renderWeek() {
    const start = mondayOf(anchor), t = todayStr();
    $("range").textContent = `${fmtShort(start)} – ${fmtShort(addDays(start,6))}, ${addDays(start,6).getFullYear()}`;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i), ds = ymd(d);
      const list = jobs.filter(j => covers(j, ds) && passes(j)).sort(byOrder);
      const dayOffs = offs.filter(o => covers(o, ds)).sort((a, b) => (a.crew || "").localeCompare(b.crew || ""));
      const isWeekend = i >= 5;
      if (isWeekend && !list.length && !dayOffs.length && ds !== t) continue;
      days.push(el("section", {class: "day" + (ds === t ? " today" : "")},
        el("h2", {}, el("span", {text: fmtDay(d)}),
          dayOffs.map(o => el("button", {class: "offchip", title: o.notes || "", onclick: () => showDetails(o), text: offLabel(o)}))),
        list.length ? el("div", {class:"jobs"}, list.map(j => jobCard(j, ds)))
                    : el("div", {class:"none", text: "No field work scheduled"})));
    }
    return el("div", {class:"days"}, days);
  }
  const byOrder = (a, b) => (a.date+(a.jobNo||"")+(a.title||"")).localeCompare(b.date+(b.jobNo||"")+(b.title||""));

  function renderMonth() {
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const start = mondayOf(first), t = todayStr();
    $("range").textContent = first.toLocaleDateString(undefined,{month:"long", year:"numeric"});
    const cells = DOW.map(d => el("div", {class:"dow", text:d}));
    const last = new Date(first.getFullYear(), first.getMonth()+1, 0);
    const end = addDays(mondayOf(last), 6);
    for (let d = start; d <= end; d = addDays(d, 1)) {
      const ds = ymd(d), list = jobs.filter(j => covers(j, ds) && passes(j)).sort(byOrder);
      const day = new Date(d);
      cells.push(el("div", {class:"cell" + (d.getMonth() !== first.getMonth() ? " out" : "") + (ds === t ? " today" : "")},
        el("button", {class:"d", text: d.getDate(), "aria-label": `Open week of ${fmtDay(d)}`,
          onclick: () => { anchor = day; setView("week"); }}),
        offs.filter(o => covers(o, ds)).map(o => el("button", {class: "offchip", title: o.notes || offLabel(o), onclick: () => showDetails(o), text: offLabel(o)})),
        list.map(j => el("button", {class:`chip ${(STATUS[j.status]||STATUS.scheduled).cls}`,
          title: [j.crew, j.jobNo, j.title].filter(Boolean).join(" · ") + " — " + (STATUS[j.status]||STATUS.scheduled).label,
          onclick: () => showDetails(j)},
          j.crew ? el("b", {text: j.crew + " "}) : null, [j.jobNo, j.title || "Untitled"].filter(Boolean).join(" ")))));
    }
    return el("div", {class:"month-wrap"}, el("div", {class:"month"}, cells));
  }

  function renderEmpty() {
    return el("div", {class:"empty"},
      el("h3", {text: loaded ? "No jobs on the schedule yet" : "Loading the schedule…"}),
      el("p", {text: loaded
        ? "Jobs and time off are added in the Field Schedule list in SharePoint. They show up here within a minute."
        : "Jobs appear here once the shared schedule loads."}),
      loaded && listUrl ? el("div", {class:"row"},
        el("a", {class:"btn primary", href: listUrl + "/NewForm.aspx", target: "_blank", rel: "noopener", text:"+ Add in SharePoint"})) : null);
  }

  function render() {
    renderSummary();
    $("vWeek").setAttribute("aria-pressed", String(view === "week"));
    $("vMonth").setAttribute("aria-pressed", String(view === "month"));
    const body = view === "week" ? renderWeek() : renderMonth();
    $("view").replaceChildren(!jobs.length && !offs.length ? renderEmpty() : body);
    $("addBtn").hidden = !listUrl;
  }
  function setView(v) { view = v; try { localStorage.setItem("fs.view", v); } catch {} render(); }

  $("vWeek").onclick = () => setView("week");
  $("vMonth").onclick = () => setView("month");
  $("todayBtn").onclick = () => { anchor = new Date(); render(); };
  $("prev").onclick = () => { anchor = view === "week" ? addDays(anchor, -7) : new Date(anchor.getFullYear(), anchor.getMonth()-1, 1); render(); };
  $("next").onclick = () => { anchor = view === "week" ? addDays(anchor, 7) : new Date(anchor.getFullYear(), anchor.getMonth()+1, 1); render(); };

  // ---- toast ----
  let toastT;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

  // ---- details (read-only; editing happens in SharePoint) ----
  function showDetails(e) {
    const isOff = !!e.offType;
    const st = isOff ? null : (STATUS[e.status] || STATUS.scheduled);
    const fmtD = v => fmtDay(parse(v));
    const row = (k, v) => v ? [el("dt", {text: k}), el("dd", {text: v})] : null;
    const when = e.updatedAt ? new Date(e.updatedAt).toLocaleString(undefined, {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}) : "";
    const box = el("div", {class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Details"},
      el("h3", {text: isOff ? offLabel(e) : (e.title || "Untitled job")}),
      st ? el("span", {class: `pill ${st.cls}`, style: "align-self:flex-start"}, el("span", {class: "lbl", text: st.label})) : null,
      el("dl", {class: "facts"},
        row("Job", e.jobNo), row("Crew", isOff ? "" : e.crew), row(isOff ? "Who" : "", isOff ? e.crew : ""),
        row("Date", fmtD(e.date) + (e.endDate ? " – " + fmtD(e.endDate) : "")),
        row("Location", e.location), row("Notes", e.notes)),
      e.updatedByName ? el("p", {class: "stamp", text: `Last updated by ${e.updatedByName}${when ? " · " + when : ""}`}) : null,
      el("div", {class: "actions"},
        e.webUrl ? el("a", {class: "btn primary", href: e.webUrl, target: "_blank", rel: "noopener", text: "Edit in SharePoint"}) : el("span"),
        el("button", {class: "btn", type: "button", text: "Close", onclick: () => close()})));
    const scrim = el("div", {class: "scrim", onclick: ev => { if (ev.target === scrim) close(); }}, box);
    const onKey = ev => { if (ev.key === "Escape") close(); };
    function close() { scrim.remove(); document.removeEventListener("keydown", onKey); }
    document.addEventListener("keydown", onKey);
    $("sheetHost").replaceChildren(scrim);
  }

  // ---- Microsoft Graph ----
  async function token() {
    const req = {scopes: SCOPES, account};
    try { return (await msalApp.acquireTokenSilent(req)).accessToken; }
    catch (e) {
      if (e instanceof msal.InteractionRequiredAuthError) { await msalApp.acquireTokenRedirect(req); return new Promise(() => {}); }
      throw e;
    }
  }
  async function graph(path) {
    const url = path.startsWith("http") ? path : GRAPH + path;
    for (let attempt = 0; attempt < 3; attempt++) {
      // This page only ever reads. It never sends POST, PATCH or DELETE requests.
      const res = await fetch(url, {method: "GET", headers: {Authorization: "Bearer " + await token()}});
      if (res.status === 429 || res.status === 503) { await new Promise(r => setTimeout(r, (Number(res.headers.get("Retry-After")) || 2) * 1000)); continue; }
      if (!res.ok) {
        let msg = res.statusText; try { msg = (await res.json()).error?.message || msg; } catch {}
        const err = new Error(msg); err.status = res.status; throw err;
      }
      return res.status === 204 ? null : res.json();
    }
    const err = new Error("Microsoft 365 is busy. Try again in a minute."); err.status = 429; throw err;
  }
  const itemsPath = () => `/sites/${siteId}/lists/${listId}/items`;
  // SharePoint date columns come back as UTC timestamps; convert to the viewer's local calendar day
  const toYmd = v => { if (!v) return ""; if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v; const d = new Date(v); return isNaN(d) ? "" : ymd(d); };
  const OFF_STATUSES = ["Off", "Out", "Time off"];
  const fromItem = it => { const f = it.fields || {}; return {id: it.id, webUrl: it.webUrl || "", title: f.Title || "", jobNo: f.JobNo || "", crew: f.Crew || "",
    date: toYmd(f.FieldDate), endDate: toYmd(f.EndDate), location: f.Location || "", notes: f.Notes || "",
    status: LABEL_TO_KEY[f.Status] || "scheduled", offType: OFF_STATUSES.includes(f.Status) ? (f.Status === "Time off" ? (f.Title || "Off") : f.Status) : "",
    updatedByName: it.lastModifiedBy?.user?.displayName || "", updatedAt: it.lastModifiedDateTime || ""}; };

  let loading = false;
  async function load() {
    if (loading || !listId) return; loading = true;
    try {
      let next = `${itemsPath()}?$select=id,webUrl,lastModifiedBy,lastModifiedDateTime&$expand=fields($select=Title,JobNo,Crew,FieldDate,EndDate,Location,Notes,Status)&$top=999`, all = [];
      while (next) { const page = await graph(next); all = all.concat(page.value || []); next = page["@odata.nextLink"]; }
      const rows = all.map(fromItem).filter(e => e.date);
      offs = rows.filter(e => e.offType).map(e => ({...e, type: e.offType}));
      jobs = rows.filter(e => !e.offType);
      if (!listUrl) { try { listUrl = (await graph(`/sites/${siteId}/lists/${listId}?$select=webUrl`)).webUrl || ""; } catch { listUrl = ""; } if (listUrl) $("addBtn").href = listUrl + "/NewForm.aspx"; }
      loaded = true; $("notice").hidden = true;
      $("syncLine").textContent = "Updated " + new Date().toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"});
      render();
    } catch (e) {
      $("notice").hidden = false;
      $("notice").textContent = e.status === 403 || e.status === 404
        ? "You don't have access to the Field Schedule list. Ask the SharePoint site owner to add you."
        : "Couldn't load the schedule: " + e.message;
    } finally { loading = false; }
  }

  // ---- sign-in and first-time setup ----
  function gate(...content) { $("gate").replaceChildren(...content); $("gate").hidden = false; $("app").hidden = true; $("addBtn").hidden = true; }
  function enterApp() { $("gate").hidden = true; $("app").hidden = false; render(); load(); }

  async function boot() {
    if (typeof msal === "undefined") { gate(el("h3", {text: "Couldn't start"}), el("p", {text: "The Microsoft sign-in library didn't load. Make sure msal-browser.min.js was uploaded next to index.html."})); return; }
    msalApp = new msal.PublicClientApplication({
      auth: {clientId: CFG.clientId, authority: "https://login.microsoftonline.com/" + CFG.tenantId,
             redirectUri: location.origin + location.pathname.replace(/index\.html$/, "")},
      cache: {cacheLocation: "localStorage"}});
    try { const res = await msalApp.handleRedirectPromise(); account = res?.account || msalApp.getAllAccounts()[0] || null; }
    catch (e) { gate(el("h3", {text: "Sign-in didn't finish"}), el("p", {text: e.message}), el("div", {class: "row"}, el("button", {class: "btn primary", text: "Try again", onclick: signIn}))); return; }
    if (!account) {
      gate(el("h3", {text: "Sign in to see the field schedule"}),
        el("p", {text: "Use your Welch Comer Microsoft account."}),
        el("div", {class: "row"}, el("button", {class: "btn primary", text: "Sign in with Microsoft", onclick: signIn})));
      return;
    }
    msalApp.setActiveAccount(account);
    $("whoName").textContent = account.name || account.username; $("who").hidden = false;
    if (!siteId || !listId) {
      gate(el("h3", {text: "Almost ready"}), el("p", {text: "Sign-in works. The page is waiting for IT to give it read access to the Field Schedule list (siteId and listId in the settings at the top of index.html)."}));
      return;
    }
    enterApp();
  }
  function signIn() { msalApp.loginRedirect({scopes: SCOPES, prompt: "select_account"}); }
  $("signOut").onclick = () => msalApp.logoutRedirect({account});

  setInterval(() => { if (!document.hidden && listId && !$("sheetHost").firstChild) load(); }, 60_000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && listId) load(); });
  render();
  boot();
})();
</script>
</body>
</html>
