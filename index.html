<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field Schedule</title>
<meta name="theme-color" content="#08385B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Schedule">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<style>
/* Welch Comer brand tokens (Tool Standards v2.1, brand-colors.css roles) */
:root{
  --wc-primary:#0076BC;       /* Bright Blue: primary buttons, links on white */
  --wc-primary-dark:#084B77;  /* Navy Blue: hover/active, secondary buttons */
  --wc-text:#373A36;          /* Dark Grey: body text, icons */
  --wc-header:#08385B;        /* Dark Blue: title bar, headings */
  --wc-bg-tint:#CCE1F3;       /* Light Blue: panels, selected */
  --wc-border:#D9D9D9;        /* Light Grey: borders, dividers */
  --wc-muted:#5F625E;
  --wc-white:#FFFFFF;
  --wc-soft:#F2F7FC;          /* faint Light Blue for quiet panels */
  /* Field processing status — kept red / yellow / green */
  --st-red:#C0362C; --st-yellow:#E2AE1C; --st-green:#2C7A45;
  --font:Roboto,Arial,system-ui,sans-serif;
  --radius:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--wc-white);color:var(--wc-text);font:400 14px/20px var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--wc-primary)}
:focus-visible{outline:2px solid var(--wc-primary);outline-offset:2px}

/* header bar: Dark Blue, white W mark, tool name, Support at the right end */
.bar{flex:none;background:var(--wc-header);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.bar img{height:24px;width:auto;display:block}
.bar h1{margin:0;font-size:18px;line-height:24px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .support{color:#fff;text-decoration:none;border:1px solid rgb(255 255 255 / .7);border-radius:6px;padding:5px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.bar .support:hover{background:var(--wc-primary-dark)}

/* main frame fills the window; nothing scrolls at page level */
.frame{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px 8px;width:100%;max-width:1400px;margin:0 auto}
#gate{overflow:auto}
#app{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* buttons */
.btn{border:1px solid var(--wc-primary-dark);background:var(--wc-white);color:var(--wc-primary-dark);border-radius:6px;padding:8px 14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--wc-soft)}
.btn.primary{background:var(--wc-primary);border-color:var(--wc-primary);color:#fff}
.btn.primary:hover{background:var(--wc-primary-dark);border-color:var(--wc-primary-dark)}
.btn:disabled{background:var(--wc-border);border-color:var(--wc-border);color:var(--wc-muted);cursor:default}
.linkbtn{border:0;background:none;padding:0;color:var(--wc-primary);font-weight:500}

/* summary counts */
.summary{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--wc-white);border:1px solid var(--wc-border);border-top:4px solid var(--c);border-radius:var(--radius);padding:6px 12px;display:flex;align-items:baseline;gap:10px;min-width:0}
.stat b{font-size:26px;line-height:32px;font-weight:400;color:var(--wc-header);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;line-height:16px;color:var(--wc-text);min-width:0}
.stat .short{display:none}
.c-red{--c:var(--st-red)} .c-yellow{--c:var(--st-yellow)} .c-green{--c:var(--st-green)} .c-blue{--c:var(--wc-primary)}

/* nav */
.nav{flex:none;display:flex;align-items:center;gap:8px}
.nav .range{font-size:20px;line-height:28px;font-weight:500;color:var(--wc-header);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:36px;height:36px;padding:0;font-size:18px}
.seg{display:inline-flex;border:1px solid var(--wc-primary-dark);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--wc-white);padding:7px 14px;font-weight:500;color:var(--wc-primary-dark)}
.seg button[aria-pressed="true"]{background:var(--wc-primary-dark);color:#fff}
.legend{display:flex;gap:12px;font-size:12px;color:var(--wc-text);white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.notice{margin:0;font-size:13px;color:var(--wc-muted)}
.notice.warn{flex:none;color:var(--st-red);font-weight:500}

/* calendar area fills the rest */
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.s-scheduled{--c:var(--st-red)} .s-partial{--c:var(--st-yellow)} .s-processed{--c:var(--st-green)}

/* month (and desktop week) grid */
.grid{flex:1;min-height:0;display:grid;gap:4px;grid-template-rows:auto}
.grid .dow{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--wc-muted);text-align:center;white-space:nowrap;overflow:hidden}
.cell{min-height:0;min-width:0;background:var(--wc-white);border:1px solid var(--wc-border);border-radius:6px;padding:3px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.ch{flex:none;display:flex;align-items:center;justify-content:space-between;gap:2px;min-width:0}
.cell.narrow .ch{flex-direction:column}
.more{flex:none;border:0;background:var(--wc-bg-tint);color:var(--wc-primary-dark);font-weight:500;font-size:11px;line-height:16px;padding:0 6px;border-radius:99px;white-space:nowrap}
.more:hover{text-decoration:underline}
.daylist{display:flex;flex-direction:column;gap:8px}

.cell.out{background:#FAFAFA;color:var(--wc-muted)}
.cell.out .d{color:#9A9C98}
.cell.today{background:var(--wc-soft);border-color:var(--wc-primary);box-shadow:inset 0 0 0 1px var(--wc-primary)}
.cell.narrow{padding:3px 1px;align-items:center}
.cell .d{flex:none;border:0;background:none;padding:0 3px;text-align:left;font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;line-height:18px;color:var(--wc-header);align-self:flex-start}
.cell.narrow .d{align-self:center;padding:0}
.chip{flex:none;border:0;border-left:4px solid var(--c);background:var(--wc-soft);border-radius:3px;font-size:12px;line-height:15px;padding:3px 5px;text-align:left;width:100%;overflow-wrap:anywhere;color:var(--wc-text)}
.chip b{font-weight:500;color:var(--wc-header)}
.chip:hover{background:var(--wc-bg-tint)}
.offchip{flex:none;border:1px dashed #B9BCB8;background:var(--wc-white);color:var(--wc-text);border-radius:4px;font-size:11.5px;line-height:15px;font-weight:500;padding:1px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.offchip:hover{border-color:var(--wc-primary)}
/* Off = whole day (solid gray); Out = part of the day (dashed blue outline, with the time) */
.offchip.off{background:var(--wc-border);border:1px solid var(--wc-border);color:var(--wc-text)}
.offchip.out{background:var(--wc-white);border:1px dashed var(--wc-primary);color:var(--wc-primary-dark)}
/* company holidays: office closed */
.cell.holiday, .wkcol.holiday .wkbody{background:repeating-linear-gradient(135deg, var(--wc-white) 0 6px, var(--wc-soft) 6px 12px)}
.hol{flex:none;align-self:stretch;font-size:11px;line-height:15px;font-weight:500;color:var(--wc-white);background:var(--wc-header);border-radius:3px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkhead .hol{display:block;margin-top:3px;font-size:11px}
.wkday .holtag{background:var(--wc-header);color:var(--wc-white);border-radius:99px;padding:0 8px;font-size:10px;line-height:16px;letter-spacing:.04em}
/* desktop week columns */
.wkcol{min-height:0;min-width:0;border:1px solid var(--wc-border);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;background:var(--wc-white)}
.wkcol.today{border-color:var(--wc-primary);box-shadow:inset 0 0 0 1px var(--wc-primary)}
.wkcol.narrow .wkhead{padding:6px 0;text-align:center}
.wkhead{flex:none;padding:6px 8px;border-bottom:1px solid var(--wc-border);background:var(--wc-soft);font-size:12px;line-height:16px;font-weight:500;color:var(--wc-header);white-space:nowrap;overflow:hidden}
.wkhead .num{font-size:18px;line-height:22px;display:block}
.wkcol.today .wkhead{background:var(--wc-bg-tint)}
.wkbody{flex:1;min-height:0;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.wkcol.narrow .wkbody{padding:6px 2px}
.card{flex:none;display:flex;flex-direction:column;gap:1px;text-align:left;width:100%;background:var(--wc-white);border:1px solid var(--wc-border);border-left:5px solid var(--c);border-radius:6px;padding:6px 8px;color:var(--wc-text)}
.card:hover{background:var(--wc-soft)}
.card .no{font-size:12px;line-height:16px;color:var(--wc-muted);font-variant-numeric:tabular-nums}
.card .name{font-weight:500;font-size:14px;line-height:18px;color:var(--wc-header);overflow-wrap:anywhere}
.card .meta{font-size:12px;line-height:16px;color:var(--wc-text);overflow-wrap:anywhere}
.card .notes{font-size:12px;line-height:16px;color:var(--wc-muted);font-style:italic;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.card .status{display:flex;align-items:center;gap:5px;font-size:12px;line-height:16px;color:var(--wc-text)}
.card .flag{font-size:12px;line-height:16px;font-weight:500;color:var(--st-red)}
.none{font-size:12px;color:#8C8F8B;padding:2px}

/* phone week list (scrolls inside the calendar area only) */
.wklist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.wkday{display:flex;flex-direction:column;gap:5px}
.wkday h2{margin:0;font-size:12px;line-height:18px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--wc-muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wkday.today h2{color:var(--wc-primary)}
/* the day you clicked: + Job and + Time off start on it */
.cell.sel, .wkcol.sel{border-color:var(--wc-primary-dark);box-shadow:inset 0 0 0 2px var(--wc-primary-dark)}
.cell.sel .d, .wkcol.sel .wkhead{color:var(--wc-primary-dark);font-weight:700}
.wkday.sel h2{color:var(--wc-primary-dark);font-weight:700}
.wkday.sel h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wc-primary-dark)}
.wkday .tag{border:1px solid currentColor;border-radius:99px;padding:0 6px;font-size:10px;line-height:15px}
.wkday .row{display:flex;gap:8px;align-items:baseline}

/* bottom bar: who / version on the left, add buttons on the right */
.foot{flex:none;display:flex;align-items:center;gap:12px;border-top:1px solid var(--wc-border);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--wc-white)}
.foot .info{flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--wc-muted)}
.foot .info span+span::before{content:" · "}
.foot .adds{display:flex;gap:8px}
.foot .adds .btn{padding:9px 16px;font-size:15px}

/* panels (passcode, name, setup, empty) */
.panel{border:1px solid var(--wc-border);border-top:4px solid var(--wc-header);border-radius:var(--radius);padding:20px 18px;display:flex;flex-direction:column;gap:12px;max-width:640px;width:100%;margin:0 auto;background:var(--wc-white)}
.panel h3{margin:0;font-size:20px;line-height:28px;font-weight:500;color:var(--wc-header)}
.panel p{margin:0;color:var(--wc-text)}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel .row input{flex:1;min-width:180px}
.ok{color:var(--st-green);font-size:13px;margin:0;font-weight:500}

/* sheets */
.scrim{position:fixed;inset:0;background:rgb(8 56 91 / .45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--wc-white);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:12px 12px 0 0;display:flex;flex-direction:column}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:12px}}
.sheet .sh{display:flex;align-items:center;gap:10px;background:var(--wc-header);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:1}
.sheet .sh h3{margin:0;flex:1;min-width:0;font-size:18px;line-height:24px;font-weight:500;overflow-wrap:anywhere}
.sheet .x{border:0;background:none;color:#fff;font-size:22px;line-height:22px;width:32px;height:32px;border-radius:6px}
.sheet .x:hover{background:var(--wc-primary-dark)}
.sheet .sb{padding:16px;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.statusset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.statusset button{border:2px solid var(--wc-border);background:var(--wc-white);border-radius:8px;padding:9px 6px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;line-height:16px}
.statusset button::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c)}
.statusset button[aria-pressed="true"]{border-color:var(--wc-primary-dark);background:var(--wc-bg-tint)}
.typeset{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.typeset button{border:2px solid var(--wc-border);background:var(--wc-white);border-radius:8px;padding:9px 6px;font-weight:500;font-size:14px;line-height:18px}
.typeset button small{display:block;font-weight:400;color:var(--wc-muted);font-size:12px}
.typeset button[aria-pressed="true"]{border-color:var(--wc-primary-dark);background:var(--wc-bg-tint)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:16px;font-weight:500;color:var(--wc-text);letter-spacing:.04em;text-transform:uppercase}
input,textarea,select{border:1px solid #B9BCB8;background:var(--wc-white);border-radius:6px;padding:8px 10px;font-size:16px;line-height:22px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
input:focus,textarea:focus,select:focus{border-color:var(--wc-primary);outline:none;box-shadow:0 0 0 2px var(--wc-bg-tint)}
input.caps{text-transform:uppercase}
textarea{min-height:64px;resize:vertical}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px}
dl.facts dt{color:var(--wc-muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
dl.facts dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:3px 10px 3px 8px;border-radius:99px;border:1px solid var(--wc-border);align-self:flex-start}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions .right{display:flex;gap:8px}
.confirm{background:#FBEDEB;border:1px solid var(--st-red);border-radius:6px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm span{flex-basis:100%;font-weight:500}
.stamp{font-size:12px;color:var(--wc-muted);margin:0}
.err{color:var(--st-red);font-size:13px;margin:0;font-weight:500}
@media (max-width:719px){.more{font-size:10px;line-height:13px;padding:0 4px}}
/* desktop drag: move a job to another day, or drag its right edge to change the Through date */
.dragok{cursor:grab;user-select:none;-webkit-user-select:none}
.dragok.edge{cursor:ew-resize}
body.dragging, body.dragging *{cursor:grabbing!important;user-select:none}
body.resizing, body.resizing *{cursor:ew-resize!important;user-select:none}
.dragsrc{opacity:.35}
.ghost{position:fixed;z-index:30;pointer-events:none;opacity:.92;box-shadow:0 6px 18px rgb(0 0 0 / .25);transform:rotate(-1.5deg)}
[data-day].droptarget{outline:2px dashed var(--wc-primary);outline-offset:-2px;background:var(--wc-bg-tint)}
[data-day].inrange{background:var(--wc-bg-tint)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--wc-header);color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* phones */
@media (max-width:719px){
  .frame{padding:8px 8px 6px;gap:8px}
  .bar{padding-left:12px;padding-right:12px}
  .legend{display:none}
  .summary{gap:4px}
  .stat{flex-direction:column;align-items:flex-start;gap:0;padding:4px 6px;border-top-width:3px}
  .stat b{font-size:20px;line-height:24px}
  .stat span{font-size:11px;line-height:13px}
  .stat .long{display:none} .stat .short{display:inline}
  .nav{gap:4px}
  .nav .range{font-size:17px;line-height:24px;padding-left:4px}
  .icon{width:32px;height:32px}
  .nav .btn{padding:6px 10px}
  .seg button{padding:6px 10px}
  .grid{gap:2px}
  .grid .dow{font-size:10px;letter-spacing:.02em}
  .cell{padding:2px;gap:2px;border-radius:4px}
  .cell .d{font-size:11px;line-height:14px;padding:0 2px}
  .chip{font-size:10px;line-height:12px;padding:2px 3px;border-left-width:3px}
  .offchip{font-size:9.5px;line-height:12px;padding:0 3px}
  .hol{font-size:9.5px;line-height:12px;padding:0 3px}
  .foot{padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:8px}
  .foot .adds .btn{padding:8px 12px;font-size:14px}
  .foot .info .upd{display:none}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.7}}}
</style>
</head>
<body>
<header class="bar">
  <img src="wmark-white.svg" alt="Welch Comer" width="68" height="24">
  <h1>Field Schedule</h1>
  <a class="support" id="supportBtn" href="#">Support</a>
</header>

<div class="frame">
  <section id="gate" class="panel" hidden></section>

  <div id="app" hidden>
    <section class="summary" id="summary" aria-label="Processing summary"></section>
    <div class="nav">
      <button class="btn icon" id="prev" aria-label="Previous">‹</button>
      <button class="btn" id="todayBtn">Today</button>
      <button class="btn icon" id="next" aria-label="Next">›</button>
      <div class="range" id="range"></div>
      <div class="legend" aria-label="Status key">
        <span class="s-scheduled"><i></i>Not processed</span>
        <span class="s-partial"><i></i>Partially processed</span>
        <span class="s-processed"><i></i>Processed</span>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="vWeek" aria-pressed="true">Week</button>
        <button id="vMonth" aria-pressed="false">Month</button>
      </div>
    </div>
    <p class="notice warn" id="notice" hidden></p>
    <main id="view" aria-live="polite"></main>
  </div>
</div>

<footer class="foot">
  <div class="info" id="info"></div>
  <div class="adds" id="addBtns" hidden>
    <button class="btn" id="addOff">+ Time off</button>
    <button class="btn primary" id="addBtn">+ Job</button>
  </div>
</footer>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";
  // ===================== settings =====================
  const APP = {name: "Field Schedule", version: "1.4.0"};
  const CREW = ["MH", "RR", "SR", "TM", "TT"];                // initials offered for time off
  const SUPPORT_EMAIL = "ttucker@welchcomer.com";
  const KEYS_FILE = "keys.json";          // made by the setup screen (#setup); holds the GitHub key, locked with the team passcode
  const ITERATIONS = 250000;              // passcode stretching (PBKDF2-SHA256)
  const DEFAULT_REPO = {owner: "welchcomer", name: "field-schedule-data", path: "schedule.json", branch: "main"};
  const API = "https://api.github.com";
  // ====================================================

  const STATUS = {
    scheduled: {label: "Not processed", cls: "s-scheduled"},
    partial:   {label: "Partially processed", cls: "s-partial"},
    processed: {label: "Processed", cls: "s-processed"},
  };
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);

      else if (k === "style") n.style.cssText = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);

    }

    return n;
  };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("fs." + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("fs." + k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem("fs." + k); } catch {} },
  };
  const isPhone = () => matchMedia("(max-width: 719px)").matches;

  // ---------- support button (mailto, per Tool Standards) ----------
  $("supportBtn").href = `mailto:${SUPPORT_EMAIL}?subject=${encodeURIComponent(`[${APP.name} v${APP.version}] Bug / Feature request`)}&body=${encodeURIComponent(
    `What were you doing?\n\n\nWhat happened?\n\n\nWhat did you expect?\n\n\n— Tool: ${APP.name} ${APP.version}`)}`;

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const weekStart = d => { const x = addDays(d, -d.getDay()); x.setHours(0,0,0,0); return x; };   // weeks start on Sunday
  const todayStr = () => ymd(new Date());
  const fmtDay = d => d.toLocaleDateString(undefined, {weekday: "long", month: "short", day: "numeric"});
  const fmtShort = d => d.toLocaleDateString(undefined, {month: "short", day: "numeric"});

  // ---------- passcode locking (Web Crypto: PBKDF2 → AES-GCM) ----------
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = bytes => { let s = ""; const b = new Uint8Array(bytes); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0));
  const normPass = p => p.normalize("NFKC").trim().toLowerCase();
  async function keyFrom(pass, salt, iterations) {
    const base = await crypto.subtle.importKey("raw", te.encode(normPass(pass)), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
  }
  async function seal(obj, pass) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, await keyFrom(pass, salt, ITERATIONS), te.encode(JSON.stringify(obj)));
    return {salt: b64(salt), iv: b64(iv), ct: b64(ct)};
  }
  async function unseal(entry, pass, iterations) {
    try {
      const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(entry.iv)}, await keyFrom(pass, unb64(entry.salt), iterations), unb64(entry.ct));
      return JSON.parse(td.decode(pt));
    } catch { return null; }
  }

  // ---------- state ----------
  let session = store.get("session");   // {mode: "edit"|"view", token, repo}
  let myName = store.get("name") || "";
  let docData = {v: 1, jobs: []}, sha = null, etag = null;
  let jobs = [], offs = [], loaded = false, lastSync = "";
  let view = store.get("view") === "month" ? "month" : "week", anchor = new Date();
  const canEdit = () => session && session.mode === "edit";

  const endOf = j => j.endDate && j.endDate >= j.date ? j.endDate : j.date;
  const covers = (j, day) => j.date <= day && endOf(j) >= day;
  const awaiting = j => (j.status || "scheduled") === "scheduled" && endOf(j) < todayStr();
  const dayNum = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
  // time off can repeat every N weeks (same weekday as its first day), until an optional date, minus skipped days
  const occurs = (o, day) => {
    if (o.skip && o.skip.includes(day)) return false;
    if (!o.repeat) return covers(o, day);
    if (day < o.date || (o.repeat.until && day > o.repeat.until)) return false;
    const span = dayNum(endOf(o)) - dayNum(o.date) + 1, period = 7 * (o.repeat.every || 1);
    return (dayNum(day) - dayNum(o.date)) % period < span;
  };
  const weekdayName = s => parse(s).toLocaleDateString(undefined, {weekday: "long"});
  const repeatText = o => {
    if (!o.repeat) return "";
    const n = o.repeat.every || 1;
    const base = n === 1 ? `Every ${weekdayName(o.date)}` : n === 2 ? `Every other ${weekdayName(o.date)}` : `Every ${n} weeks on ${weekdayName(o.date)}`;
    return base + (o.repeat.until ? ` until ${fmtShort(parse(o.repeat.until))}` : "") + `, starting ${fmtShort(parse(o.date))}`;
  };
  const shortTime = t => { const [h, m] = t.split(":").map(Number); return `${h % 12 || 12}${m ? ":" + String(m).padStart(2, "0") : ""}${h < 12 ? "a" : "p"}`; };
  const longTime = t => { const [h, m] = t.split(":").map(Number); return new Date(2000, 0, 1, h, m).toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"}); };
  const offLabel = o => `${o.crew || "Someone"} ${(o.offType || "Off").toLowerCase()}${o.offType === "Out" && o.time ? " " + shortTime(o.time) : ""}`;

  // ---------- company holidays (office closed) ----------
  // A holiday on a Saturday is observed Friday; on a Sunday, Monday. If two land on the same day, the later one in the
  // list moves back to the previous weekday (e.g. Christmas Eve when Christmas is observed on Dec 24).
  const nthWeekday = (y, m, wd, n) => { const d = new Date(y, m, 1); d.setDate(1 + (wd - d.getDay() + 7) % 7 + (n - 1) * 7); return d; };
  const lastWeekday = (y, m, wd) => { const d = new Date(y, m + 1, 0); d.setDate(d.getDate() - (d.getDay() - wd + 7) % 7); return d; };
  const HOLIDAYS = y => [
    ["New Year's Day", new Date(y, 0, 1)],
    ["Memorial Day", lastWeekday(y, 4, 1)],
    ["Independence Day", new Date(y, 6, 4)],
    ["Labor Day", nthWeekday(y, 8, 1, 1)],
    ["Thanksgiving", nthWeekday(y, 10, 4, 4)],
    ["Day after Thanksgiving", addDays(nthWeekday(y, 10, 4, 4), 1)],
    ["Christmas Day", new Date(y, 11, 25)],
    ["Christmas Eve", new Date(y, 11, 24)],
  ];
  const holidayYears = new Map();
  function holidaysOf(y) {
    if (holidayYears.has(y)) return holidayYears.get(y);
    const out = new Map();
    for (const [name, d] of HOLIDAYS(y)) {
      let o = d.getDay() === 6 ? addDays(d, -1) : d.getDay() === 0 ? addDays(d, 1) : new Date(d);
      while (out.has(ymd(o)) || o.getDay() === 0 || o.getDay() === 6) o = addDays(o, -1);
      out.set(ymd(o), name + (ymd(o) !== ymd(d) ? " (observed)" : ""));
    }
    holidayYears.set(y, out); return out;
  }
  const holidayOn = ds => { const y = +ds.slice(0, 4); return holidaysOf(y).get(ds) || holidaysOf(y + 1).get(ds) || null; };
  const byOrder = (a, b) => (a.date + (a.crew || "") + (a.jobNo || "") + (a.title || "")).localeCompare(b.date + (b.crew || "") + (b.jobNo || "") + (b.title || ""));
  const jobsOn = ds => jobs.filter(j => covers(j, ds)).sort(byOrder);
  const offsOn = ds => offs.filter(o => occurs(o, ds)).sort(byOrder);

  // ---------- GitHub storage ----------
  const contentsPath = () => `/repos/${encodeURIComponent(session.repo.owner)}/${encodeURIComponent(session.repo.name)}/contents/${session.repo.path.split("/").map(encodeURIComponent).join("/")}`;
  async function gh(path, opts = {}) {
    return fetch(API + path, {method: opts.method || "GET", cache: "no-store",
      headers: {Authorization: "Bearer " + session.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {})},
      body: opts.body ? JSON.stringify(opts.body) : undefined});
  }
  async function httpError(res) {
    let msg = res.statusText || "Request failed"; try { msg = (await res.json()).message || msg; } catch {}
    const e = new Error(msg); e.status = res.status; return e;
  }
  const toB64Utf8 = s => b64(te.encode(s));
  const fromB64Utf8 = s => td.decode(unb64(s));
  function useDoc(d) {
    docData = d && Array.isArray(d.jobs) ? d : {v: 1, jobs: []};
    const valid = docData.jobs.filter(j => j && /^\d{4}-\d{2}-\d{2}$/.test(j.date || ""));
    offs = valid.filter(j => j.kind === "off");
    jobs = valid.filter(j => j.kind !== "off");
  }
  async function fetchDoc(fresh) {
    const res = await gh(`${contentsPath()}?ref=${encodeURIComponent(session.repo.branch)}`, {headers: !fresh && etag ? {"If-None-Match": etag} : {}});
    if (res.status === 304) return false;
    if (res.status === 404) { sha = null; etag = null; useDoc(null); return true; }
    if (!res.ok) throw await httpError(res);
    etag = res.headers.get("ETag");
    const j = await res.json(); sha = j.sha;
    useDoc(JSON.parse(fromB64Utf8(j.content || "") || "{}"));
    return true;
  }
  let loading = false;
  async function load(fresh) {
    if (loading || !session) return; loading = true;
    try {
      const changed = await fetchDoc(fresh);
      loaded = true; $("notice").hidden = true;
      lastSync = new Date().toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"});
      renderInfo();
      if (changed) render();
    } catch (e) {
      if (e.status === 401) { lock("The saved key no longer works. Enter the passcode again (it may have been changed)."); return; }
      showNotice(e.status === 403 && /rate limit/i.test(e.message) ? "GitHub is limiting requests right now. The schedule will refresh in a few minutes."
        : "Couldn't load the schedule: " + e.message);
    } finally { loading = false; }
  }
  // Save = read the latest copy, apply one change to it, write it back. Retries if someone else saved in between.
  async function save(change, message) {
    for (let attempt = 0; attempt < 4; attempt++) {
      await fetchDoc(true);
      const next = JSON.parse(JSON.stringify(docData));
      change(next);
      const body = {message: `${message}${myName ? " — " + myName : ""}`, content: toB64Utf8(JSON.stringify(next, null, 1) + "\n"), branch: session.repo.branch};
      if (sha) body.sha = sha;
      const res = await gh(contentsPath(), {method: "PUT", body});
      if (res.ok) { const j = await res.json(); sha = j.content?.sha || null; etag = null; useDoc(next); render(); return; }
      if (res.status === 409 || res.status === 422) { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); continue; }
      throw await httpError(res);
    }
    throw new Error("Someone else was saving at the same moment. Try again.");
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const stamp = obj => Object.assign(obj, {updatedBy: myName, updatedAt: new Date().toISOString()});
  const upsert = item => d => { const i = d.jobs.findIndex(j => j.id === item.id); if (i >= 0) d.jobs[i] = item; else d.jobs.push(item); };
  const remove = id => d => { d.jobs = d.jobs.filter(j => j.id !== id); };
  const saveError = ex => ex && (ex.status === 403 || ex.status === 404)
    ? "The saved key can't make changes. Ask Tom to check the schedule setup."
    : "Couldn't save: " + ((ex && ex.message) || "check your connection and try again.");

  // ---------- footer info ----------
  function renderInfo() {
    $("info").replaceChildren(
      el("span", {text: `${APP.name} v${APP.version}`}),
      session && myName ? el("span", {text: myName}) : null,
      session ? el("span", {}, el("button", {class: "linkbtn", text: "Lock", onclick: () => lock()})) : null,
      session && lastSync ? el("span", {class: "upd", text: "Updated " + lastSync}) : null);
  }

  // ---------- summary ----------
  function renderSummary() {
    const t = todayStr(), cutoff = ymd(addDays(new Date(), -30));
    const n = {
      awaiting: jobs.filter(awaiting).length,
      partial: jobs.filter(j => j.status === "partial").length,
      upcoming: jobs.filter(j => (j.status || "scheduled") === "scheduled" && endOf(j) >= t).length,
      processed: jobs.filter(j => j.status === "processed" && endOf(j) >= cutoff).length,
    };
    const tiles = [["awaiting", "c-red", "Field done, not processed", "Waiting"], ["partial", "c-yellow", "Partially processed", "Partial"],
                   ["upcoming", "c-blue", "Scheduled ahead", "Ahead"], ["processed", "c-green", "Processed, last 30 days", "Done 30d"]];
    $("summary").replaceChildren(...tiles.map(([k, cls, long, short]) =>
      el("div", {class: `stat ${cls}`, title: long}, el("b", {text: loaded ? n[k] : "–"}),
        el("span", {}, el("span", {class: "long", text: long}), el("span", {class: "short", text: short})))));
  }

  // ---------- items ----------
  const hoverText = e => e.notes || undefined;   // tooltip is just the typed notes
  function jobCard(j, day) {
    const st = STATUS[j.status] || STATUS.scheduled;
    return draggable(el("button", {class: `card ${st.cls}`, title: hoverText(j), onclick: () => { if (!suppressClick) details(j); }},
      j.jobNo ? el("span", {class: "no", text: j.jobNo}) : null,
      el("span", {class: "name", text: j.title || "Untitled job"}),
      el("span", {class: "meta", text: [j.crew, j.location].filter(Boolean).join(" · ")}),
      j.endDate && j.endDate > j.date ? el("span", {class: "meta", text: `${fmtShort(parse(j.date))} – ${fmtShort(parse(j.endDate))}`}) : null,
      j.notes ? el("span", {class: "notes", text: j.notes}) : null,
      el("span", {class: "status"}, el("span", {class: "dot"}), st.label),
      awaiting(j) ? el("span", {class: "flag", text: "Field done · waiting on office"}) : null), j, day);
  }
  const offChip = (o, day, short) => el("button", {class: "offchip " + (o.offType === "Out" ? "out" : "off"), title: hoverText(o), onclick: () => details(o, day),
    text: short ? (o.crew || "?") : offLabel(o) + (o.repeat ? " ↻" : "")});
  const jobChip = (j, day) => draggable(el("button", {class: `chip ${(STATUS[j.status] || STATUS.scheduled).cls}`, title: hoverText(j), onclick: () => { if (!suppressClick) details(j); }},
    j.crew ? el("b", {text: j.crew + " "}) : null, [j.jobNo, j.title || "Untitled"].filter(Boolean).join(" ")), j, day);

  // Sun / Sat columns stay as narrow as their label unless a job is scheduled on them
  const NARROW = () => isPhone() ? "28px" : "44px";
  function columns(days) {
    // only jobs widen a weekend column; time off on a weekend shows as initials in the narrow column
  const used = w => days.some(ds => parse(ds).getDay() === w && jobsOn(ds).length);
    const sun = used(0), sat = used(6);
    return {sun, sat, css: `${sun ? "minmax(0,1fr)" : NARROW()} repeat(5, minmax(0,1fr)) ${sat ? "minmax(0,1fr)" : NARROW()}`};
  }

  // ---------- views ----------
  function renderMonth() {
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1), t = todayStr();
    $("range").textContent = first.toLocaleDateString(undefined, isPhone() ? {month: "short", year: "numeric"} : {month: "long", year: "numeric"});
    const start = weekStart(first), end = addDays(weekStart(new Date(first.getFullYear(), first.getMonth() + 1, 0)), 6);
    const days = []; for (let d = new Date(start); d <= end; d = addDays(d, 1)) days.push(ymd(d));
    const cols = columns(days), weeks = days.length / 7;
    const cells = DOW.map((d, i) => el("div", {class: "dow", text: (i === 0 && !cols.sun) || (i === 6 && !cols.sat) ? d.slice(0, isPhone() ? 2 : 3) : d}));
    for (const ds of days) {
      const d = parse(ds), w = d.getDay(), narrow = (w === 0 && !cols.sun) || (w === 6 && !cols.sat);
      const hol = holidayOn(ds);
      cells.push(el("div", {class: "cell" + (d.getMonth() !== first.getMonth() ? " out" : "") + (ds === t ? " today" : "") + (narrow ? " narrow" : "") + (hol ? " holiday" : ""), "data-day": ds},
        el("div", {class: "ch"}, el("button", {class: "d", text: d.getDate(), "aria-label": "Open week of " + fmtDay(d), onclick: () => { anchor = d; setView("week"); }})),
        hol ? el("div", {class: "hol", title: hol + " · office closed", text: hol}) : null,
        offsOn(ds).map(o => offChip(o, ds, narrow)),
        jobsOn(ds).map(j => jobChip(j, ds))));
    }
    return el("div", {class: "grid", style: `grid-template-columns:${cols.css};grid-template-rows:auto repeat(${weeks}, minmax(0,1fr))`}, cells);
  }
  // a day with more than fits shows "+N more", which opens that day's full list
  function fitCells() {
    document.querySelectorAll("#view .cell").forEach(cell => {
      cell.querySelector(".more")?.remove();
      const items = [...cell.querySelectorAll(".offchip, .chip")];
      items.forEach(i => i.hidden = false);

      const more = el("button", {class: "more", type: "button", onclick: () => daySheet(cell.dataset.day)});
      cell.querySelector(".ch").append(more);
      let n = 0;
      for (let k = items.length - 1; k >= 0 && cell.scrollHeight > cell.clientHeight + 1; k--) { items[k].hidden = true; n++; more.textContent = `+${n} more`; }
    });
  }
  function daySheet(ds) {
    const s = sheet(fmtDay(parse(ds)),
      el("div", {class: "daylist"}, holidayOn(ds) ? el("div", {class: "hol", text: holidayOn(ds) + " · office closed"}) : null,
        offsOn(ds).map(o => offChip(o, ds, false)), jobsOn(ds).map(jobCard)),
      el("div", {class: "actions"}, el("span"), el("button", {class: "btn", type: "button", text: "Close", onclick: () => s.close()})));
  }
  function weekDays() { const s = weekStart(anchor); return [...Array(7)].map((_, i) => ymd(addDays(s, i))); }
  function weekRange(days) {
    const a = parse(days[0]), b = parse(days[6]);
    $("range").textContent = `${fmtShort(a)} – ${fmtShort(b)}${isPhone() ? "" : ", " + b.getFullYear()}`;
  }
  function renderWeekColumns() {
    const days = weekDays(), t = todayStr(), cols = columns(days); weekRange(days);
    return el("div", {class: "grid", style: `grid-template-columns:${cols.css};grid-template-rows:minmax(0,1fr)`},
      days.map(ds => {
        const d = parse(ds), w = d.getDay(), narrow = (w === 0 && !cols.sun) || (w === 6 && !cols.sat), list = jobsOn(ds), dayOffs = offsOn(ds);
        const hol = holidayOn(ds);
        return el("div", {class: "wkcol" + (ds === t ? " today" : "") + (narrow ? " narrow" : "") + (hol ? " holiday" : ""), "data-day": ds},
          el("div", {class: "wkhead"}, narrow ? DOW[w] : d.toLocaleDateString(undefined, {weekday: "short"}).toUpperCase(), el("span", {class: "num", text: d.getDate()}),
            hol ? el("span", {class: "hol", title: hol + " · office closed", text: hol}) : null),
          el("div", {class: "wkbody"}, dayOffs.map(o => offChip(o, ds, narrow)), list.map(j => jobCard(j, ds)),
            !narrow && !list.length && !dayOffs.length && !hol ? el("div", {class: "none", text: "No field work"}) : null));
      }));
  }
  function renderWeekList() {
    const days = weekDays(), t = todayStr(); weekRange(days);
    return el("div", {class: "wklist"}, days.map((ds, i) => {
      const d = parse(ds), list = jobsOn(ds), dayOffs = offsOn(ds);
      if ((i === 0 || i === 6) && !list.length && !dayOffs.length && ds !== t) return null;
      const hol = holidayOn(ds);
      return el("section", {class: "wkday" + (ds === t ? " today" : ""), "data-day": ds},
        el("h2", {}, el("span", {text: fmtDay(d)}), ds === t ? el("span", {class: "tag", text: "Today"}) : null,
          hol ? el("span", {class: "holtag", text: hol}) : null, dayOffs.map(o => offChip(o, ds, false))),
        list.length ? list.map(jobCard) : el("div", {class: "none", text: hol ? "Office closed" : "No field work scheduled"}));
    }));
  }
  function renderEmpty() {
    return el("div", {class: "panel"},
      el("h3", {text: loaded ? "No jobs on the schedule yet" : "Loading the schedule…"}),
      loaded ? el("p", {text: "Add a field job with + Job, or time off with + Time off. New jobs start red until the office processes the field data."}) : null);
  }
  function render() {
    renderSummary(); renderInfo();
    $("vWeek").setAttribute("aria-pressed", String(view === "week"));

    $("addBtns").hidden = !canEdit() || $("app").hidden;
  }
  // ---- picking a day: click empty space in a day to select it; + Job / + Time off then start on that day.
  // Double-click empty space opens + Job for that day.
  let selDay = null;
  const markSelected = () => document.querySelectorAll("#view [data-day]").forEach(n => n.classList.toggle("sel", n.dataset.day === selDay));
  const visible = ds => !!document.querySelector(`#view [data-day="${ds}"]`);
  // the picked day if it's on screen, else today if it's on screen, else the first weekday shown
  const startDay = () => selDay && visible(selDay) ? selDay : visible(todayStr()) ? todayStr()
    : view === "month" ? ymd(new Date(anchor.getFullYear(), anchor.getMonth(), 1)) : ymd(addDays(weekStart(anchor), 1));
  const dayFromClick = e => e.target.closest("button, a, input, select, textarea, .chip, .offchip, .card, .hol") ? null
    : e.target.closest("#view [data-day]")?.dataset.day || null;
  $("view").addEventListener("click", e => { const ds = dayFromClick(e); if (ds) { selDay = ds; markSelected(); } });
  $("view").addEventListener("dblclick", e => { const ds = dayFromClick(e); if (ds && canEdit()) { selDay = ds; markSelected(); openJob(null); } });
  function setView(v) { view = v; store.set("view", v); render(); }
  $("vWeek").onclick = () => setView("week");
  $("vMonth").onclick = () => setView("month");
  $("todayBtn").onclick = () => { anchor = new Date(); render(); };
  $("prev").onclick = () => { anchor = view === "week" ? addDays(anchor, -7) : new Date(anchor.getFullYear(), anchor.getMonth() - 1, 1); render(); };
  $("next").onclick = () => { anchor = view === "week" ? addDays(anchor, 7) : new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1); render(); };
  $("addBtn").onclick = () => openJob(null);
  $("addOff").onclick = () => openOff(null, {date: startDay()});
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (!$("app").hidden) render(); }, 120); });

  // ---------- desktop drag: move or extend a job ----------
  let suppressClick = false;
  const canDrag = () => canEdit() && !isPhone() && matchMedia("(hover: hover) and (pointer: fine)").matches;
  const EDGE = 8;   // px from the right edge that grabs the Through date
  const daysBetween = (a, b) => dayNum(b) - dayNum(a);
  const shift = (ds, n) => ymd(addDays(parse(ds), n));
  function draggable(node, job, day) {
    if (!day || !canDrag()) return node;
    node.classList.add("dragok");
    node.addEventListener("pointermove", e => { if (!e.buttons) node.classList.toggle("edge", e.clientX > node.getBoundingClientRect().right - EDGE); });
    node.addEventListener("pointerleave", () => node.classList.remove("edge"));
    node.addEventListener("pointerdown", e => {
      if (e.pointerType !== "mouse" || e.button !== 0) return;
      const resize = e.clientX > node.getBoundingClientRect().right - EDGE;
      const sx = e.clientX, sy = e.clientY;
      let started = false, ghost = null, target = null;
      const dayAt = (x, y) => document.elementFromPoint(x, y)?.closest("[data-day]")?.dataset.day || null;
      const clearMarks = () => document.querySelectorAll(".droptarget, .inrange").forEach(c => c.classList.remove("droptarget", "inrange"));
      const move = ev => {
        if (!started) {
          if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
          started = true; document.body.classList.add(resize ? "resizing" : "dragging");
          if (!resize) {
            const r = node.getBoundingClientRect();
            ghost = node.cloneNode(true); ghost.classList.add("ghost"); ghost.style.width = r.width + "px"; document.body.append(ghost);
            document.querySelectorAll(".dragok").forEach(n => { if (n.__job === job.id) n.classList.add("dragsrc"); });
          }
        }
        if (ghost) { ghost.style.left = ev.clientX + 8 + "px"; ghost.style.top = ev.clientY + 8 + "px"; }
        if (ghost) ghost.style.display = "none";
        target = dayAt(ev.clientX, ev.clientY);
        if (ghost) ghost.style.display = "";
        clearMarks();
        if (!target) return;
        if (resize) {
          const last = target < job.date ? job.date : target;
          document.querySelectorAll("#view [data-day]").forEach(c => { const d = c.dataset.day; if (d >= job.date && d <= last) c.classList.add("inrange"); });
        } else document.querySelector(`#view [data-day="${target}"]`)?.classList.add("droptarget");
      };
      const up = async () => {
        removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("keydown", esc);
        clearMarks(); ghost?.remove(); document.body.classList.remove("dragging", "resizing");
        document.querySelectorAll(".dragsrc").forEach(n => n.classList.remove("dragsrc"));
        if (!started) return;
        suppressClick = true; setTimeout(() => suppressClick = false, 0);
        if (!target) return;
        const what = job.jobNo || job.title;
        let item, msg;
        if (resize) {
          const end = target <= job.date ? "" : target;
          if (end === (job.endDate || "")) return;
          item = {...job, endDate: end};
          msg = end ? `Extend ${what} through ${fmtShort(parse(end))}` : `Set ${what} to one day`;
        } else {
          const n = daysBetween(day, target);
          if (!n) return;
          item = {...job, date: shift(job.date, n), endDate: job.endDate ? shift(job.endDate, n) : ""};
          msg = `Move ${what} to ${fmtShort(parse(item.date))}`;
        }
        stamp(item);
        const before = jobs; jobs = jobs.map(x => x.id === item.id ? item : x); render();   // show it right away
        try { await save(upsert(item), msg); toast(msg); }
        catch (ex) { jobs = before; render(); toast(saveError(ex)); }
      };
      const esc = ev => { if (ev.key === "Escape") { target = null; up(); } };
      addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("keydown", esc);
      e.preventDefault();
    });
    node.__job = job.id;
    return node;
  }

  let toastT;
  function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
  function showNotice(t) { $("notice").textContent = t; $("notice").hidden = false; }

  // ---------- sheets ----------
  function sheet(title, ...content) {
    const box = el("div", {class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": title},
      el("div", {class: "sh"}, el("h3", {text: title}), el("button", {class: "x", type: "button", "aria-label": "Close", text: "×", onclick: () => close()})),
      el("div", {class: "sb"}, ...content));
    const scrim = el("div", {class: "scrim", onclick: e => { if (e.target === scrim) close(); }}, box);
    const onKey = e => { if (e.key === "Escape") close(); };
    function close() { scrim.remove(); document.removeEventListener("keydown", onKey); }
    document.addEventListener("keydown", onKey);
    $("sheetHost").replaceChildren(scrim);
    return {box, close};
  }
  const stampText = e => e.updatedBy || e.updatedAt
    ? `Last updated${e.updatedBy ? " by " + e.updatedBy : ""}${e.updatedAt ? " · " + new Date(e.updatedAt).toLocaleString(undefined, {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}) : ""}` : "";
  // force capitals as people type (keeps the cursor where it was)
  const capsInput = props => { const i = el("input", {...props, class: "caps", autocapitalize: "characters", autocomplete: "off", spellcheck: "false"});
    i.addEventListener("input", () => { const a = i.selectionStart, b = i.selectionEnd; i.value = i.value.toUpperCase(); try { i.setSelectionRange(a, b); } catch {} }); return i; };

  // details view: shown on click, with an Edit button
  function details(e, day) {
    const isOff = e.kind === "off", st = STATUS[e.status] || STATUS.scheduled;
    const row = (k, v) => v ? [el("dt", {text: k}), el("dd", {text: v})] : null;
    const s = sheet(isOff ? offLabel(e) : (e.title || "Untitled job"),
      isOff ? null : el("span", {class: `pill ${st.cls}`}, st.label),
      el("dl", {class: "facts"},
        row("Job", e.jobNo), row(isOff ? "Who" : "Crew", e.crew),
        isOff ? row("Type", e.offType === "Out" ? "Out part of the day" + (e.time ? " · " + longTime(e.time) : "") : "Off all day") : null,
        e.repeat ? row("Repeats", repeatText(e)) : row("Date", fmtDay(parse(e.date)) + (e.endDate && e.endDate > e.date ? " – " + fmtDay(parse(e.endDate)) : "")),
        e.repeat && day ? row("This day", fmtDay(parse(day))) : null,
        row("Location", e.location), row("Notes", e.notes)),
      stampText(e) ? el("p", {class: "stamp", text: stampText(e)}) : null,
      el("div", {class: "actions"},
        canEdit() ? el("button", {class: "btn primary", type: "button", text: "Edit", onclick: () => { s.close(); isOff ? openOff(e, {}, day) : openJob(e); }}) : el("span"),
        el("button", {class: "btn", type: "button", text: "Close", onclick: () => s.close()})));
  }

  function openJob(job) {
    if (!canEdit()) { if (job) details(job); return; }
    const isNew = !job;
    const draft = isNew ? {status: "scheduled", date: startDay()} : {...job};
    const statusBtns = Object.entries(STATUS).map(([k, s]) => el("button", {type: "button", class: s.cls, "aria-pressed": String(draft.status === k),
      onclick: e => { draft.status = k; statusBtns.forEach(b => b.setAttribute("aria-pressed", String(b === e.currentTarget))); }}, s.label));
    const inp = (id, v, ph, extra = {}) => el("input", {id, value: v || "", placeholder: ph, ...extra});
    const iNo = inp("f_jobNo", draft.jobNo, "e.g. 42021.200", {inputmode: "decimal"});
    const iCrew = capsInput({id: "f_crew", value: draft.crew || "", placeholder: "e.g. RR/SR"});
    const iTitle = inp("f_title", draft.title, "Job name or site"), iLoc = inp("f_location", draft.location, "Address, township/range, etc.");
    const iDate = inp("f_date", draft.date, "", {type: "date"}), iEnd = inp("f_endDate", draft.endDate, "", {type: "date"});
    const iNotes = el("textarea", {id: "f_notes"}); iNotes.value = draft.notes || "";
    const err = el("p", {class: "err", hidden: true});
    const what = job ? [job.jobNo, job.title].filter(Boolean).join(" ") : "";
    const confirmBox = el("div", {class: "confirm", hidden: true}, el("span", {text: `Delete ${what || "this job"} for everyone?`}),
      el("button", {class: "btn", type: "button", text: "Delete", onclick: doDelete}),
      el("button", {class: "btn", type: "button", text: "Keep", onclick: () => confirmBox.hidden = true}));
    const saveBtn = el("button", {class: "btn primary", type: "submit", text: isNew ? "Add job" : "Save"});
    const form = el("form", {style: "display:contents"},
      el("div", {class: "statusset", role: "group", "aria-label": "Processing status"}, statusBtns),
      el("div", {class: "fields"},
        el("label", {class: "f", for: "f_jobNo"}, "Job number", iNo),
        el("label", {class: "f", for: "f_crew"}, "Crew", iCrew),
        el("label", {class: "f full", for: "f_title"}, "Job", iTitle),
        el("label", {class: "f", for: "f_date"}, "Field date", iDate),
        el("label", {class: "f", for: "f_endDate"}, "Through (optional)", iEnd),
        el("label", {class: "f full", for: "f_location"}, "Location", iLoc),
        el("label", {class: "f full", for: "f_notes"}, "Notes", iNotes)),
      !isNew && stampText(job) ? el("p", {class: "stamp", text: stampText(job)}) : null,
      err, confirmBox,
      el("div", {class: "actions"},
        !isNew ? el("button", {class: "btn", type: "button", text: "Delete", onclick: () => confirmBox.hidden = false}) : el("span"),
        el("div", {class: "right"}, el("button", {class: "btn", type: "button", text: "Cancel", onclick: () => s.close()}), saveBtn)));
    const s = sheet(isNew ? "Add field job" : "Edit job", form);
    (isNew ? iNo : statusBtns.find(b => b.getAttribute("aria-pressed") === "true"))?.focus();

    form.addEventListener("submit", async e => {
      e.preventDefault(); err.hidden = true;
      const item = stamp({...(job || {}), id: job?.id || newId(), kind: "job", status: draft.status || "scheduled",
        jobNo: iNo.value.trim(), crew: iCrew.value.trim().toUpperCase(), title: iTitle.value.trim(), location: iLoc.value.trim(), notes: iNotes.value.trim(),
        date: iDate.value, endDate: iEnd.value && iEnd.value > iDate.value ? iEnd.value : ""});
      if (!item.date) { err.textContent = "Pick a field date."; err.hidden = false; return; }
      if (!item.title && !item.jobNo) { err.textContent = "Enter a job name or job number."; err.hidden = false; return; }
      saveBtn.disabled = true;
      const w = item.jobNo || item.title;
      const msg = isNew ? `Add ${w}` : (job.status !== item.status ? `Mark ${w} ${STATUS[item.status].label.toLowerCase()}` : `Edit ${w}`);
      try { await save(upsert(item), msg); s.close(); toast(isNew ? "Job added" : "Saved"); }
      catch (ex) { saveBtn.disabled = false; err.textContent = saveError(ex); err.hidden = false; }
    });
    async function doDelete() {
      try { await save(remove(job.id), `Delete ${job.jobNo || job.title}`); s.close(); toast("Job deleted"); }
      catch (ex) { err.textContent = saveError(ex); err.hidden = false; }
    }
  }

  function openOff(entry, seed = {}, onDay) {
    if (!canEdit()) { if (entry) details(entry, onDay); return; }
    const isNew = !entry;
    const d = isNew ? {offType: "Off", crew: seed.crew || "", date: seed.date || todayStr(), endDate: "", notes: ""} : {...entry};
    const types = [["Off", "All day"], ["Out", "Part of the day"]].map(([k, sub]) =>
      el("button", {type: "button", "aria-pressed": String(d.offType === k),
        onclick: e => { d.offType = k; types.forEach(b => b.setAttribute("aria-pressed", String(b === e.currentTarget))); timeLabel.hidden = k !== "Out"; }}, k, el("small", {text: sub})));
    const iTime = el("input", {id: "o_time", type: "time", value: d.time || ""});
    const timeLabel = el("label", {class: "f full", for: "o_time", hidden: d.offType !== "Out"}, "Time (optional) — when they leave or the appointment", iTime);
    const people = CREW.includes(d.crew) || !d.crew ? CREW : [...CREW, d.crew];
    const iWho = el("select", {id: "o_crew"}, el("option", {value: "", text: "Choose…", disabled: true, selected: !d.crew}),
      people.map(p => el("option", {value: p, text: p, selected: p === d.crew})));
    const iFrom = el("input", {id: "o_date", type: "date", value: d.date});
    const iTo = el("input", {id: "o_end", type: "date", value: d.endDate || ""});
    const iNote = el("textarea", {id: "o_notes", placeholder: "Optional, e.g. back at 1pm"}); iNote.value = d.notes || "";
    const every = String(d.repeat?.every || 0);
    const iRep = el("select", {id: "o_repeat"}, [["0", "Doesn't repeat"], ["1", "Every week"], ["2", "Every 2 weeks"], ["4", "Every 4 weeks"]]
      .map(([v, t]) => el("option", {value: v, text: t, selected: v === every})));
    const iUntil = el("input", {id: "o_until", type: "date", value: d.repeat?.until || ""});
    const untilLabel = el("label", {class: "f", for: "o_until", hidden: every === "0"}, "Repeat until (optional)", iUntil);
    const repHint = el("p", {class: "notice"});
    const hint = () => { untilLabel.hidden = iRep.value === "0"; repHint.textContent = iRep.value === "0" || !iFrom.value ? "" : repeatText({date: iFrom.value, repeat: {every: +iRep.value, until: iUntil.value}}); };
    iRep.addEventListener("change", hint); iFrom.addEventListener("change", hint); iUntil.addEventListener("change", hint);
    const err = el("p", {class: "err", hidden: true});
    const oneDay = !isNew && entry.repeat && onDay;
    const confirmBox = el("div", {class: "confirm", hidden: true},
      el("span", {text: oneDay ? `Remove ${offLabel(entry)} for which days?` : `Remove ${entry ? offLabel(entry) : "this time off"} for everyone?`}),
      oneDay ? el("button", {class: "btn", type: "button", text: "Just " + fmtShort(parse(onDay)), onclick: () => doDelete(false)}) : null,
      el("button", {class: "btn", type: "button", text: oneDay ? "All of them" : "Remove", onclick: () => doDelete(true)}),
      el("button", {class: "btn", type: "button", text: "Keep", onclick: () => confirmBox.hidden = true}));
    const saveBtn = el("button", {class: "btn primary", type: "submit", text: isNew ? "Add time off" : "Save"});
    const form = el("form", {style: "display:contents"},
      el("div", {class: "typeset", role: "group", "aria-label": "Type"}, types),
      el("div", {class: "fields"},
        el("label", {class: "f full", for: "o_crew"}, "Who", iWho),
        timeLabel,
        el("label", {class: "f", for: "o_date"}, "From", iFrom),
        el("label", {class: "f", for: "o_end"}, "Through (optional)", iTo),
        el("label", {class: "f", for: "o_repeat"}, "Repeats", iRep),
        untilLabel,
        el("div", {class: "full"}, repHint),
        el("label", {class: "f full", for: "o_notes"}, "Note", iNote)),
      !isNew && stampText(entry) ? el("p", {class: "stamp", text: stampText(entry)}) : null,
      err, confirmBox,
      el("div", {class: "actions"},
        !isNew ? el("button", {class: "btn", type: "button", text: "Remove", onclick: () => confirmBox.hidden = false}) : el("span"),
        el("div", {class: "right"}, el("button", {class: "btn", type: "button", text: "Cancel", onclick: () => s.close()}), saveBtn)));
    const s = sheet(isNew ? "Add time off" : "Edit time off", form);
    hint(); iWho.focus();
    form.addEventListener("submit", async e => {
      e.preventDefault(); err.hidden = true;
      const item = stamp({id: entry?.id || newId(), kind: "off", offType: d.offType, crew: iWho.value,
        date: iFrom.value, endDate: iTo.value && iTo.value > iFrom.value ? iTo.value : "", notes: iNote.value.trim()});
      if (d.offType === "Out" && iTime.value) item.time = iTime.value;
      if (iRep.value !== "0") {
        item.repeat = {every: +iRep.value, until: iUntil.value && iUntil.value >= iFrom.value ? iUntil.value : ""};
        const keep = (entry?.skip || []).filter(x => x >= item.date);
        if (keep.length) item.skip = keep;
      }
      if (!item.crew || !item.date) { err.textContent = "Choose who is off and the first day."; err.hidden = false; return; }
      saveBtn.disabled = true;
      try { await save(upsert(item), `${isNew ? "Add" : "Edit"} time off: ${offLabel(item)} ${item.date}`); s.close(); toast(isNew ? "Time off added" : "Saved"); }
      catch (ex) { saveBtn.disabled = false; err.textContent = saveError(ex); err.hidden = false; }
    });
    async function doDelete(all) {
      try {
        if (all) await save(remove(entry.id), `Remove time off: ${offLabel(entry)} ${entry.date}${entry.repeat ? " (repeating)" : ""}`);
        else await save(doc => { const it = doc.jobs.find(x => x.id === entry.id); if (it) { it.skip = [...new Set([...(it.skip || []), onDay])].sort(); stamp(it); } },
          `Skip ${onDay} for repeating time off: ${offLabel(entry)}`);
        s.close(); toast(all ? "Time off removed" : "Removed for " + fmtShort(parse(onDay)));
      } catch (ex) { err.textContent = saveError(ex); err.hidden = false; }
    }
  }

  // ---------- lock screen ----------
  function gate(...content) { $("gate").replaceChildren(...content); $("gate").hidden = false; $("app").hidden = true; $("addBtns").hidden = true; renderInfo(); }
  function lock(why) {
    session = null; store.del("session"); docData = {v: 1, jobs: []}; jobs = []; offs = []; sha = null; etag = null; loaded = false; lastSync = "";
    const pass = el("input", {id: "pass", type: "password", autocomplete: "current-password", placeholder: "Passcode", enterkeyhint: "go"});
    const err = el("p", {class: "err", hidden: !why, text: why || ""});
    const go = el("button", {class: "btn primary", type: "submit", text: "Open"});
    const form = el("form", {style: "display:contents"},
      el("h3", {text: "Enter the schedule passcode"}),
      el("p", {text: "Ask the survey office for the team passcode. You only need to enter it once on this device."}),
      el("div", {class: "row"}, pass, go), err);
    form.addEventListener("submit", async e => {
      e.preventDefault(); err.hidden = true;
      if (!pass.value.trim()) return;
      go.disabled = true; go.textContent = "Checking…";
      try {
        const res = await fetch(KEYS_FILE + "?t=" + Date.now(), {cache: "no-store"});
        if (!res.ok) throw new Error("setup");
        const keys = await res.json();
        let payload = null;
        for (const entry of keys.entries || []) { payload = await unseal(entry, pass.value, keys.iterations || ITERATIONS); if (payload) break; }
        if (!payload || !payload.token) { err.textContent = "That passcode didn't work. Check it and try again."; err.hidden = false; return; }
        session = {mode: payload.mode === "edit" ? "edit" : "view", token: payload.token, repo: {...DEFAULT_REPO, ...(payload.repo || {})}};
        store.set("session", session);
        enterApp();
      } catch (ex) {
        err.textContent = ex.message === "setup" ? "The schedule hasn't been set up yet (keys.json is missing)." : "Couldn't check the passcode: " + ex.message;
        err.hidden = false;
      } finally { go.disabled = false; go.textContent = "Open"; }
    });
    gate(form);
    pass.focus();
  }

  function askName(then) {
    const inp = el("input", {id: "myname", placeholder: "e.g. Ann", value: myName, autocomplete: "name"});
    const form = el("form", {style: "display:contents"},
      el("h3", {text: "What's your name?"}),
      el("p", {text: "It's shown next to the changes you make, so others know who updated a job."}),
      el("div", {class: "row"}, inp, el("button", {class: "btn primary", type: "submit", text: "Continue"})));
    form.addEventListener("submit", e => { e.preventDefault(); if (!inp.value.trim()) return; myName = inp.value.trim(); store.set("name", myName); then(); });
    gate(form); inp.focus();
  }

  function enterApp() {
    if (canEdit() && !myName) return askName(enterApp);
    $("gate").hidden = true; $("app").hidden = false;
    render(); load(true);
  }

  // ---------- setup (#setup) — Tom only: locks the GitHub key with the team passcode ----------
  function setupScreen() {
    const f = (id, label, props = {}) => { const i = el("input", {id, ...props}); return [i, el("label", {class: "f full", for: id}, label, i)]; };
    const [iRepo, lRepo] = f("s_repo", "Data repository (owner/name)", {value: `${DEFAULT_REPO.owner}/${DEFAULT_REPO.name}`});
    const [iTok, lTok] = f("s_token", "GitHub key (fine-grained token, Contents: Read and write)", {type: "password", placeholder: "github_pat_…", autocomplete: "off"});
    const [iPass, lPass] = f("s_pass", "Team passcode", {autocomplete: "off"});
    const msg = el("div", {style: "display:flex;flex-direction:column;gap:4px"});
    const say = (t, cls = "notice") => msg.append(el("p", {class: cls, text: t}));
    const btn = el("button", {class: "btn primary", type: "submit", text: "Check key and create keys.json"});
    const form = el("form", {style: "display:contents"},
      el("h3", {text: "Field Schedule setup"}),
      el("p", {text: "Nothing typed here leaves this computer except a check with GitHub. The key is locked with the passcode, and the result downloads as keys.json for you to upload next to index.html."}),
      el("div", {class: "fields"}, lRepo, lTok, lPass), msg,
      el("div", {class: "row"}, btn, el("a", {class: "btn", href: "./", text: "Back to schedule"})));
    form.addEventListener("submit", async e => {
      e.preventDefault(); msg.replaceChildren();
      const [owner, name] = iRepo.value.trim().split("/");
      if (!owner || !name) return say("Enter the data repository as owner/name.", "err");
      if (normPass(iPass.value).length < 8) return say("Use a passcode of at least 8 characters (two or three words is best).", "err");
      btn.disabled = true;
      try {
        const r = await fetch(`${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`, {cache: "no-store", headers: {Authorization: "Bearer " + iTok.value.trim(), Accept: "application/vnd.github+json"}});
        if (!r.ok) throw new Error(r.status === 401 ? "GitHub rejected the key" : r.status === 404 ? `the key can't see ${owner}/${name}` : "GitHub said " + r.status);
        if (!((await r.json()).permissions || {}).push) return say("The key can read but not save. Give it Contents: Read and write.", "err");
        say("The key works.", "ok");
        const repo = {owner, name, path: DEFAULT_REPO.path, branch: DEFAULT_REPO.branch};
        const entries = [await seal({mode: "edit", token: iTok.value.trim(), repo}, iPass.value)];
        const blob = new Blob([JSON.stringify({v: 1, iterations: ITERATIONS, entries}, null, 1)], {type: "application/json"});
        const a = el("a", {href: URL.createObjectURL(blob), download: "keys.json"}); document.body.append(a); a.click(); a.remove();
        say("keys.json downloaded. Upload it to the field-schedule repository (replace the old one if there is one).", "ok");
        iTok.value = "";
      } catch (ex) { say("Couldn't create keys.json: " + ex.message, "err"); }
      finally { btn.disabled = false; }
    });
    gate(form);
  }

  // ---------- boot ----------
  setInterval(() => { if (session && !document.hidden && !$("sheetHost").firstChild) load(false); }, 60000);
  document.addEventListener("visibilitychange", () => { if (session && !document.hidden) load(false); });
  window.addEventListener("hashchange", () => location.reload());
  renderInfo();
  if (location.hash === "#setup") setupScreen();
  else if (!window.crypto?.subtle) gate(el("h3", {text: "This browser can't open the schedule"}), el("p", {text: "Open the page from its https:// address in an up-to-date browser."}));
  else if (session && session.token) enterApp();
  else lock();
})();
</script>
</body>
</html>
