<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="msal-browser.min.js"></script>
<script>
/* ===================== CONFIGURATION — edit these once ===================== */
window.FIELD_SCHEDULE_CONFIG = {
  // From the Entra ID (Azure AD) app registration — see SETUP.md
  clientId: "",
  tenantId: "",                 // Directory (tenant) ID, or "welchcomer.com"

  // The department calendar. Leave blank and each person picks it once from a list.
  calendar: {
    mailbox: "",                // e.g. "survey@welchcomer.com" if it lives in a shared mailbox; blank = calendars shared with the person
    name: ""                    // e.g. "Survey Field Schedule"
  },

  // Outlook category names that mean each status. Blank = detect red/green automatically.
  categories: {
    scheduled: "",              // red   — field work not yet processed
    partial:   "",              // yellow — partially processed
    processed: ""               // green — office has processed it
  },

  // Words that mark an entry as time off rather than a field job (after the crew initials)
  offWords: ["OFF", "OUT", "PTO", "SICK", "VACATION", "HOLIDAY"],

  timeZone: "Pacific Standard Time"
};
</script>
<style>
/* Layout: one column, summary first, then a week agenda (or month grid); status lives in a left stripe + pill on every job */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --sunk:#E8EDF1; --ink:#15202B; --muted:#5A6876; --line:#D6DDE3;
  --accent:#1D5C88; --accent-ink:#FFFFFF;
  --red:#C0362C; --amber:#A87900; --amber-mark:#E2AE1C; --green:#2C7A45;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E141A; --surface:#17202A; --sunk:#121A22; --ink:#E5EBF0; --muted:#93A0AD; --line:#283440;
  --accent:#6CB0DE; --accent-ink:#0E141A;
  --red:#EE6D61; --amber:#E7B84A; --amber-mark:#E7B84A; --green:#62C083; color-scheme:dark}}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1;margin:2px 0 0;letter-spacing:.01em}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--c)}
.stat b{font-family:var(--font-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.25}
.stat[aria-pressed="true"]{outline:2px solid var(--c);outline-offset:-1px}
@media (max-width:560px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav .range{font-family:var(--font-display);font-weight:600;font-size:21px;flex:1;min-width:0}
.icon{width:38px;height:38px;padding:0;font-size:18px}
@media (max-width:560px){.nav .range{flex-basis:100%;order:-1;font-size:20px}.nav .seg{margin-left:auto}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.subnav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

.days{display:flex;flex-direction:column;gap:14px}
.day h2{margin:0 0 6px;font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.day.today h2{color:var(--accent)}
.day.today h2 .tag{font-size:11px;letter-spacing:.1em;border:1px solid currentColor;border-radius:99px;padding:0 7px}
.day h2 .offs{font-family:var(--font-body);font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--muted)}
.day .none{color:var(--muted);font-size:13.5px;padding:2px 0 0 2px}
.jobs{display:flex;flex-direction:column;gap:8px}
.job{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:0 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:0 12px 0 0;text-align:left;width:100%;overflow:hidden;min-height:64px}
.job.other{opacity:.8}
.job .stripe{align-self:stretch;background:var(--c)}
.job .main{padding:10px 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.job .no{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.job .name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.job .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.job .flag{font-size:12.5px;font-weight:600;color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;color:var(--ct);background:color-mix(in srgb,var(--c) 15%,transparent)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pill.busy::before{animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
.s-scheduled{--c:var(--red);--ct:var(--red)}
.s-partial{--c:var(--amber-mark);--ct:var(--amber)}
.s-processed{--c:var(--green);--ct:var(--green)}
.s-none{--c:var(--line);--ct:var(--muted)}
.s-all{--c:var(--accent)}
@media (max-width:420px){.job .pill .lbl{display:none}.job .pill{padding:6px}}

.month-wrap{overflow-x:auto}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:330px}
.month .dow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:76px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{background:transparent;border-style:dashed}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .d{border:0;background:none;padding:0 2px;text-align:left;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--muted)}
.chip{border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));border-radius:3px;font-size:11.5px;line-height:1.2;padding:2px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.more{font-size:11px;color:var(--muted);padding-left:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-family:var(--font-display);font-size:24px}
.panel p{margin:0;color:var(--muted);max-width:62ch}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.callist{display:flex;flex-direction:column;gap:6px}
.callist button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.callist small{color:var(--muted)}
.notice{font-size:13.5px;color:var(--muted);margin:0}
.notice.warn{color:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.demo-bar{background:color-mix(in srgb,var(--amber-mark) 22%,var(--surface));border:1px solid var(--amber-mark);border-radius:8px;padding:8px 12px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:13px 20px;box-shadow:0 6px 18px rgb(0 0 0 / .22);font-size:16px;z-index:5}

.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-family:var(--font-display);font-size:24px;overflow-wrap:anywhere}
.sheet .sub{margin:-8px 0 0;color:var(--muted);font-size:14px}
.statusset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.statusset button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 6px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;line-height:1.2}
.statusset button::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--c)}
.statusset button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14.5px}
dl.facts dt{color:var(--muted);font-weight:600;font-size:12.5px;padding-top:2px}
dl.facts dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;font-weight:400;width:100%;min-width:0}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.err{color:var(--red);font-size:13.5px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.catsw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small>Welch Comer · Survey</small><h1>Field Schedule</h1></div>
    <div class="who" id="who" hidden>
      <span id="whoName"></span>
      <button class="btn small" id="settingsBtn">Settings</button>
    </div>
  </header>

  <div class="demo-bar" id="demoBar" hidden>
    <span>Preview with made-up sample jobs. Nothing here touches Outlook.</span>
    <button class="btn small" id="exitDemo">Exit preview</button>
  </div>

  <section id="gate" class="panel" hidden></section>

  <div id="app" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="legend" aria-label="Status key">
        <span class="s-scheduled"><i></i>Not processed</span>
        <span class="s-partial"><i></i>Partially processed</span>
        <span class="s-processed"><i></i>Processed</span>
      </div>
      <section class="summary" id="summary" aria-label="Processing summary"></section>
      <div class="nav">
        <button class="btn icon" id="prev" aria-label="Previous">‹</button>
        <button class="btn" id="todayBtn">Today</button>
        <button class="btn icon" id="next" aria-label="Next">›</button>
        <div class="range" id="range"></div>
        <div class="seg" role="group" aria-label="View">
          <button id="vWeek" aria-pressed="true">Week</button>
          <button id="vMonth" aria-pressed="false">Month</button>
        </div>
      </div>
      <div class="subnav">
        <label class="toggle"><input type="checkbox" id="fieldOnly" checked> Field jobs only</label>
        <span id="syncState"></span>
      </div>
      <p class="notice warn" id="notice" hidden></p>
      <main id="view" aria-live="polite"></main>
    </div>
  </div>
</div>

<button class="btn primary fab" id="addBtn" hidden>+ Add job</button>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";
  const CFG = window.FIELD_SCHEDULE_CONFIG;
  const SCOPES = ["User.Read", "Calendars.ReadWrite", "Calendars.ReadWrite.Shared", "MailboxSettings.Read"];
  const GRAPH = "https://graph.microsoft.com/v1.0";
  const STATUS = {
    scheduled: {label: "Not processed", cls: "s-scheduled"},
    partial:   {label: "Partially processed", cls: "s-partial"},
    processed: {label: "Processed", cls: "s-processed"},
  };
  // Outlook preset colors (Graph categoryColor) — used to show category swatches and to auto-detect red/green
  const PRESET = {preset0:"#E7514A",preset1:"#F38B3A",preset2:"#B67A47",preset3:"#F2C744",preset4:"#55B05B",preset5:"#3EB4A5",preset6:"#8BA647",preset7:"#4C8DD6",preset8:"#9A6DCF",preset9:"#DC5D8F",preset10:"#6E8597",preset11:"#4C6577",preset12:"#9B9B9B",preset13:"#6B6B6B",preset14:"#2B2B2B",preset15:"#A3302B",preset16:"#B05A1E",preset17:"#7D5537",preset18:"#A98B1F",preset19:"#2F7A33",preset20:"#257C73",preset21:"#5C7A24",preset22:"#22548F",preset23:"#5B3E91",preset24:"#9B3462"};

  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
    return n;
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem("fs." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("fs." + k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem("fs." + k); } catch {} },
  };

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const mondayOf = d => { const x = addDays(d, -((d.getDay()+6) % 7)); x.setHours(0,0,0,0); return x; };
  const todayStr = () => ymd(new Date());
  const fmtDay = d => d.toLocaleDateString(undefined, {weekday:"long", month:"short", day:"numeric"});
  const fmtShort = d => d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
  const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;

  // ---------- subject parsing: "RR/TM - 42021.200 Mon Search" ----------
  const JOBNO = /\b\d{4,6}(?:\.\d{1,3}){1,2}\b/;
  function parseSubject(subject) {
    const s = (subject || "").trim();
    const m = s.match(/^([A-Z]{2,3}(?:\s*\/\s*[A-Z]{2,3})*)\s*(?:[-–—]\s*|\s+(?=\d{4}))(.+)$/);
    const crew = m ? m[1].replace(/\s+/g, "") : "";
    let rest = m ? m[2].trim() : s;
    const off = !!m && CFG.offWords.some(w => rest.toUpperCase() === w);
    let jobNo = "";
    const j = rest.match(JOBNO);
    if (j) { jobNo = j[0]; rest = (rest.slice(0, j.index) + rest.slice(j.index + j[0].length)).replace(/^\s*[-–—:]?\s*/, "").replace(/\s{2,}/g, " ").trim(); }
    const isField = !off && (!!jobNo || !!crew);
    return {crew, jobNo, name: rest || s, isField, off};
  }

  // ---------- state ----------
  let mode = "live";                // "live" | "demo"
  let msalApp = null, account = null;
  let cal = null;                   // {path, name, owner, canEdit}
  let cats = {scheduled: "", partial: "", processed: ""};
  let master = [];                  // [{displayName, color}]
  const months = new Map();         // "YYYY-MM" -> {at: ms, events: [...]}
  let events = [];                  // normalized, deduped
  let view = store.get("view", "week"), anchor = new Date(), filter = "all";
  let fieldOnly = store.get("fieldOnly", true);
  let busy = new Set();
  $("fieldOnly").checked = fieldOnly;

  // ---------- Graph ----------
  async function token() {
    const req = {scopes: SCOPES, account};
    try { return (await msalApp.acquireTokenSilent(req)).accessToken; }
    catch (e) {
      if (e instanceof msal.InteractionRequiredAuthError) { await msalApp.acquireTokenRedirect(req); return new Promise(() => {}); }
      throw e;
    }
  }
  async function graph(path, opts = {}) {
    const url = path.startsWith("http") ? path : GRAPH + path;
    for (let attempt = 0; attempt < 3; attempt++) {
      const res = await fetch(url, {
        method: opts.method || "GET",
        headers: {Authorization: "Bearer " + await token(), "Content-Type": "application/json",
                  Prefer: `outlook.timezone="${CFG.timeZone}"`, ...(opts.headers || {})},
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      if (res.status === 429 || res.status === 503) {
        await new Promise(r => setTimeout(r, (Number(res.headers.get("Retry-After")) || 2) * 1000)); continue;
      }
      if (!res.ok) {
        let msg = res.statusText; try { msg = (await res.json()).error?.message || msg; } catch {}
        const err = new Error(msg); err.status = res.status; throw err;
      }
      return res.status === 204 ? null : res.json();
    }
    const err = new Error("Microsoft 365 is busy. Try again in a minute."); err.status = 429; throw err;
  }
  async function graphAll(path) {
    let out = [], next = path;
    while (next) { const page = await graph(next); out = out.concat(page.value || []); next = page["@odata.nextLink"]; }
    return out;
  }

  // ---------- event normalization ----------
  function normalize(ev) {
    const sd = ev.start.dateTime.slice(0, 10);
    let ed = ev.end.dateTime.slice(0, 10);
    const endMidnight = ev.end.dateTime.slice(11, 19) === "00:00:00";
    if ((ev.isAllDay || endMidnight) && ed > sd) ed = ymd(addDays(parse(ed), -1));
    const p = parseSubject(ev.subject);
    const cs = ev.categories || [];
    const status = cats.processed && cs.includes(cats.processed) ? "processed"
                 : cats.partial && cs.includes(cats.partial) ? "partial"
                 : cats.scheduled && cs.includes(cats.scheduled) ? "scheduled" : (p.isField ? "scheduled" : "none");
    return {id: ev.id, subject: ev.subject || "(No subject)", ...p, date: sd, endDate: ed > sd ? ed : "",
      time: ev.isAllDay ? "" : ev.start.dateTime.slice(11, 16), categories: cs, status,
      location: ev.location?.displayName || "", preview: ev.bodyPreview || "", webLink: ev.webLink || ""};
  }
  const endOf = e => e.endDate || e.date;
  const covers = (e, d) => e.date <= d && endOf(e) >= d;
  const awaiting = e => e.isField && e.status === "scheduled" && endOf(e) < todayStr();
  function rebuild() {
    const byId = new Map();
    for (const m of months.values()) for (const e of m.events) byId.set(e.id, e);
    events = [...byId.values()];
  }

  async function loadMonth(key, force) {
    const have = months.get(key);
    if (have && !force && Date.now() - have.at < 90_000) return;
    if (mode === "demo") { if (!have) months.set(key, {at: Date.now(), events: demoMonth(key)}); return; }
    const [y, m] = key.split("-").map(Number);

  // ---------- demo data (made-up) ----------
  function demoMonth(key) {
    const [y, m] = key.split("-").map(Number), out = [];
    const t = new Date(), crews = ["AB", "CD", "AB/CD", "EF", "CD/EF"];
    const names = ["Topo", "Boundary Survey", "ROW Staking", "Mon Search", "Control Network", "As-Built", "Utility Locate Shots", "Pond As-Built", "Curb Staking"];
    const days = new Date(y, m, 0).getDate();
    let seed = y * 100 + m; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let d = 1; d <= days; d++) {
      const date = new Date(y, m-1, d); if (date.getDay() === 0 || date.getDay() === 6) continue;
      const n = 1 + Math.floor(rnd() * 2.4);
      for (let i = 0; i < n; i++) {
        const ds = ymd(date), past = ds < ymd(t);
        const r = rnd(), cat = past ? (r < .55 ? "Green Category" : r < .75 ? "Partially Processed" : "Red Category") : "Red Category";
        const no = `${40000 + Math.floor(rnd()*9000)}.${pad(Math.floor(rnd()*30))}${rnd() < .5 ? ".0" : ""}`;
        const span = rnd() < .12 ? 2 : 1;
        out.push(normalize({id: `demo-${ds}-${i}`, subject: `${crews[Math.floor(rnd()*crews.length)]} - ${no} Sample ${names[Math.floor(rnd()*names.length)]}`,
          isAllDay: true, start: {dateTime: ds + "T00:00:00"}, end: {dateTime: ymd(addDays(date, span)) + "T00:00:00"}, categories: [cat], location: {displayName: ""}}));
      }
      if (rnd() < .25) out.push(normalize({id: `demo-off-${d}`, subject: `${["AB","EF"][Math.floor(rnd()*2)]} - OFF`, isAllDay: true,
        start: {dateTime: ymd(date) + "T00:00:00"}, end: {dateTime: ymd(addDays(date, 1)) + "T00:00:00"}, categories: ["Yellow Category"]}));
      if (date.getDay() === 3) out.push(normalize({id: `demo-mtg-${d}`, subject: "Weekly survey meeting", isAllDay: false,
        start: {dateTime: ymd(date) + "T15:30:00"}, end: {dateTime: ymd(date) + "T16:30:00"}, categories: []}));
    }
    return out;
  }
  async function startDemo() {
    mode = "demo"; $("demoBar").hidden = false; $("whoName").textContent = "Preview";
    cal = {path: "", name: "Sample field calendar", owner: "", canEdit: true};
    months.clear(); await loadCategories(); enterApp();
  }
  $("exitDemo").onclick = () => { location.reload(); };

  // ---------- boot ----------
  async function boot() {
    if (!CFG.clientId || typeof msal === "undefined") {
      gate(el("h3", {text: "Almost ready"}),
        el("p", {text: typeof msal === "undefined"
          ? "The Microsoft sign-in library didn't load. Make sure msal-browser.min.js was uploaded next to index.html."
          : "This page still needs the Microsoft 365 app registration filled in at the top of the file (clientId and tenantId). SETUP.md walks through it."}),
        el("div", {class: "row"}, demoBtn()));
      return;
    }
    msalApp = new msal.PublicClientApplication({
      auth: {clientId: CFG.clientId, authority: "https://login.microsoftonline.com/" + CFG.tenantId, redirectUri: location.origin + location.pathname},
      cache: {cacheLocation: "localStorage"},
    });
    try {
      const res = await msalApp.handleRedirectPromise();
      account = res?.account || msalApp.getAllAccounts()[0] || null;
    } catch (e) { gate(el("h3", {text: "Sign-in didn't finish"}), el("p", {text: e.message}), el("div", {class: "row"}, el("button", {class: "btn primary", text: "Try again", onclick: signIn}))); return; }
    if (!account) {
      gate(el("h3", {text: "Sign in to see the field schedule"}),
        el("p", {text: "Use your Welch Comer Microsoft account. The schedule comes straight from the department's Outlook calendar, and status changes show up in Outlook too."}),
        el("div", {class: "row"}, el("button", {class: "btn primary", text: "Sign in with Microsoft", onclick: signIn}), demoBtn()));
      return;
    }
    msalApp.setActiveAccount(account);
    $("whoName").textContent = account.name || account.username;
    try { await loadCategories(); } catch (e) { master = []; cats = {...CFG.categories, ...(store.get("cats", {}))}; }
    cal = store.get("cal", null);
    if (cal) enterApp(); else chooseCalendar();
  }
  function signIn() { msalApp.loginRedirect({scopes: SCOPES, prompt: "select_account"}); }

  setInterval(() => { if (!document.hidden && cal && mode === "live") sync(true); }, 120_000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && cal && mode === "live") sync(true); });

  window.__fs_test = {parseSubject};
  boot();
})();
</script>
